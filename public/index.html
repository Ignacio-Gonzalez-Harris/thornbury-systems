<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Thornbury Systems</title>
<style>
  :root{
    --paper: #f4efe2;
    --paper-card: #fbf8f0;
    --paper-card-edge: #e9e0c9;
    --ink: #2a241d;
    --ink-soft: #5a5142;
    --ink-faint: #8a806c;
    --rule: rgba(42,36,29,0.18);
    --rule-strong: rgba(42,36,29,0.38);
    --accent: #6e1423;
    --accent-soft: #8a2233;
    --accent-tint: #f4e4e2;
    --good: #245c3a;
    --good-tint: #e3ebe0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(180deg, rgba(42,36,29,0.015) 0px, rgba(42,36,29,0.015) 1px, transparent 1px, transparent 34px),
      radial-gradient(ellipse at top left, rgba(255,255,255,0.5), transparent 60%),
      var(--paper);
    color:var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size:15px;
    line-height:1.5;
    min-width:360px;
  }
  h1,h2,h3,.serif{
    font-family: Cambria, Georgia, "Times New Roman", "Liberation Serif", serif;
  }
  .num, .money, td.num, th.num{
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
  }
  .money{ white-space:nowrap; }
  a{ color:var(--accent); }

  /* ---------- masthead / nav ---------- */
  .masthead{
    background:var(--paper-card);
    border-bottom:3px double var(--rule-strong);
  }
  .masthead-inner{
    max-width:1100px;
    margin:0 auto;
    padding:22px 28px 0 28px;
    display:flex;
    flex-wrap:wrap;
    justify-content:space-between;
    align-items:flex-end;
    gap:16px;
  }
  .brand-name{
    font-size:28px;
    font-weight:700;
    letter-spacing:.01em;
    color:var(--ink);
  }
  .brand-tagline{
    font-size:12.5px;
    color:var(--ink-soft);
    letter-spacing:.05em;
    text-transform:uppercase;
    margin-top:2px;
  }
  .brand-version{
    font-size:11px;
    color:var(--ink-faint);
    letter-spacing:.05em;
    margin-top:2px;
  }
  .tabs{
    display:flex;
    gap:2px;
    margin-bottom:-3px;
  }
  .tab{
    font-family: Cambria, Georgia, "Times New Roman", serif;
    background:var(--paper);
    border:1px solid var(--rule-strong);
    border-bottom:none;
    color:var(--ink-soft);
    padding:9px 20px 10px 20px;
    font-size:14.5px;
    cursor:pointer;
    border-radius:5px 5px 0 0;
    position:relative;
    top:1px;
  }
  .tab:hover{ color:var(--ink); background:#efe8d6; }
  .tab.active{
    background:var(--paper-card);
    color:var(--accent);
    font-weight:700;
    border-color:var(--rule-strong);
    border-bottom:3px solid var(--paper-card);
  }

  /* ---------- layout ---------- */
  .content{
    max-width:1100px;
    margin:0 auto;
    padding:30px 28px 70px 28px;
  }
  .crumb{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:14px;
  }
  .crumb button{
    background:none;border:none;padding:0;
    color:var(--accent);
    font-size:13px;cursor:pointer;
    text-decoration:underline;
    font-family:inherit;
  }
  .page-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    flex-wrap:wrap;
    gap:8px;
    border-bottom:1px solid var(--rule);
    padding-bottom:10px;
    margin-bottom:22px;
  }
  .page-head h1{
    font-size:23px;
    margin:0;
  }
  .page-head .sub{
    font-size:13px;
    color:var(--ink-soft);
  }

  /* ---------- generic ledger sheet/card ---------- */
  .sheet{
    background:var(--paper-card);
    border:1px solid var(--paper-card-edge);
    box-shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 22px rgba(42,36,29,.05);
    padding:26px 30px;
    margin-bottom:24px;
  }
  .sheet-title{
    font-size:12px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin:0 0 14px 0;
    border-bottom:1px solid var(--rule);
    padding-bottom:8px;
  }

  /* ---------- ledger tables ---------- */
  .table-scroll{ overflow-x:auto; }
  table.ledger{
    width:100%;
    border-collapse:collapse;
  }
  table.ledger th{
    text-align:left;
    font-size:11.5px;
    letter-spacing:.07em;
    text-transform:uppercase;
    color:var(--ink-faint);
    font-weight:600;
    padding:0 10px 8px 10px;
    border-bottom:1px solid var(--rule-strong);
  }
  table.ledger th.num, table.ledger td.num{ text-align:right; }
  table.ledger td{
    padding:10px 10px;
    border-bottom:1px solid var(--rule);
    vertical-align:top;
  }
  table.ledger tbody tr:last-child td{ border-bottom:1px solid var(--rule-strong); }
  table.ledger tr.clickable{ cursor:pointer; }
  table.ledger tr.clickable:hover td{ background:var(--accent-tint); }
  table.ledger td.id, table.ledger th.id{ font-variant-numeric: tabular-nums; color:var(--ink-soft); }

  .row-total td{
    border-top:1px solid var(--rule-strong);
    border-bottom:none !important;
    padding-top:12px;
    font-weight:600;
  }
  .row-grand td{
    border-bottom:3px double var(--ink) !important;
    padding-bottom:14px;
    font-weight:700;
    font-size:16px;
  }
  .row-grand td.num{ color:var(--accent); }

  .status{
    display:inline-block;
    font-family:Cambria, Georgia, serif;
    font-size:11px;
    letter-spacing:.09em;
    text-transform:uppercase;
    padding:2px 8px;
    border:1px solid currentColor;
    border-radius:2px;
  }
  .status.paid{ color:var(--good); }
  .status.unpaid{ color:var(--accent); }

  /* ---------- loading / error ---------- */
  .loading-msg{
    color:var(--ink-faint);
    font-style:italic;
    padding:20px 4px;
  }
  .error-msg{
    color:var(--accent);
    background:var(--accent-tint);
    border:1px dashed var(--rule-strong);
    padding:18px 20px;
    font-size:14px;
  }

  /* ---------- overview screen ---------- */
  .summary-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0 40px;
  }
  .summary-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:11px 0;
    border-bottom:1px solid var(--rule);
  }
  .summary-row .label{ color:var(--ink-soft); font-size:14px; }
  .summary-row .value{ font-size:17px; font-weight:600; }
  .summary-row.grand{
    border-bottom:3px double var(--ink);
    padding-bottom:14px;
  }
  .summary-row.grand .value{ font-size:24px; color:var(--accent); font-family:Cambria, Georgia, serif; }
  @media (max-width:760px){ .summary-grid{ grid-template-columns:1fr; } }

  /* ---------- customer / statement ---------- */
  .cust-header{
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:20px;
    margin-bottom:6px;
  }
  .cust-name{ font-size:20px; font-weight:700; }
  .cust-meta{ color:var(--ink-soft); font-size:13.5px; margin-top:3px; }
  .badge-type{
    display:inline-block;
    font-size:10.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    border:1px solid var(--rule-strong);
    padding:1px 7px;
    border-radius:2px;
    margin-left:8px;
    vertical-align:1px;
  }
  .outstanding-box{ text-align:right; }
  .outstanding-box .label{
    font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);
  }
  .outstanding-box .amt{
    font-family:Cambria, Georgia, serif;
    font-size:26px;
    font-weight:700;
    color:var(--accent);
  }
  .outstanding-box .amt.zero{ color:var(--good); }

  /* ---------- printable document (statement / invoice) ---------- */
  .document{
    background:var(--paper-card);
    border:1px solid var(--paper-card-edge);
    box-shadow:0 1px 2px rgba(0,0,0,.04), 0 10px 26px rgba(42,36,29,.07);
    max-width:760px;
    margin:0 auto;
    padding:0;
    position:relative;
    overflow:hidden;
  }
  .letterhead{
    padding:26px 34px 18px 34px;
    border-bottom:3px double var(--ink);
    display:flex;
    justify-content:space-between;
    gap:24px;
    flex-wrap:wrap;
  }
  .letterhead .co-name{
    font-family:Cambria, Georgia, serif;
    font-size:22px;
    font-weight:700;
    letter-spacing:.01em;
  }
  .letterhead .co-detail{ font-size:11.5px; color:var(--ink-soft); line-height:1.55; margin-top:4px; }
  .letterhead .doc-type{
    text-align:right;
    font-family:Cambria, Georgia, serif;
    font-size:19px;
    letter-spacing:.03em;
    text-transform:uppercase;
    color:var(--accent);
  }
  .letterhead .doc-meta{ font-size:12.5px; color:var(--ink-soft); text-align:right; margin-top:6px; line-height:1.6; }
  .doc-body{ padding:22px 34px 30px 34px; }
  .doc-parties{
    display:flex;
    justify-content:space-between;
    gap:24px;
    flex-wrap:wrap;
    margin-bottom:22px;
    font-size:13.5px;
  }
  .doc-parties .to-label{
    font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);
    margin-bottom:4px;
  }
  .doc-parties .to-name{ font-weight:700; }
  .doc-parties address{ font-style:normal; color:var(--ink-soft); line-height:1.5; }

  .stamp{
    position:absolute;
    top:148px;
    right:50px;
    transform:rotate(-11deg);
    background:rgba(251,248,240,0.92);
    border:3px solid;
    border-radius:6px;
    padding:5px 14px;
    font-family:Cambria, Georgia, serif;
    font-size:19px;
    font-weight:700;
    letter-spacing:.12em;
    opacity:.85;
    pointer-events:none;
    z-index:2;
  }
  .stamp.is-paid{ color:var(--good); border-color:var(--good); }
  .stamp.is-unpaid{ color:var(--accent); border-color:var(--accent); }

  .vat-note{
    margin-top:18px;
    font-size:12px;
    color:var(--ink-soft);
    font-style:italic;
    border-top:1px solid var(--rule);
    padding-top:12px;
  }
  .doc-foot{
    font-size:11.5px;
    color:var(--ink-faint);
    text-align:center;
    padding:14px 20px 22px 20px;
    border-top:1px solid var(--rule);
  }

  /* ---------- schedule ---------- */
  .day-label{
    font-family:Cambria, Georgia, serif;
    font-size:15px;
    font-weight:700;
    margin:0 0 12px 0;
    padding-bottom:8px;
    border-bottom:1px solid var(--rule-strong);
    display:flex;
    justify-content:space-between;
    align-items:baseline;
  }
  .day-label .count{ font-size:12px; font-weight:400; color:var(--ink-soft); text-transform:none; letter-spacing:0; }
  .slot-row{
    display:flex;
    gap:18px;
    align-items:flex-start;
    padding:12px 4px;
    border-bottom:1px solid var(--rule);
  }
  .slot-row.not-dispatched{ opacity:.68; }
  .slot-window{
    width:150px;
    flex:0 0 auto;
    font-variant-numeric: tabular-nums;
    font-weight:700;
    font-family:Cambria, Georgia, serif;
    color:var(--ink);
  }
  .slot-window .lbl{ display:block; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); font-weight:400; font-family:inherit; margin-top:2px; }
  .slot-main{ flex:1 1 auto; }
  .slot-wo{ font-weight:700; }
  .slot-addr{ color:var(--ink-soft); font-size:13px; }
  .slot-flag{
    font-size:11px;
    color:var(--accent);
    text-transform:uppercase;
    letter-spacing:.06em;
    font-weight:700;
  }
  .footnote{
    margin-top:16px;
    padding-top:12px;
    border-top:1px solid var(--rule);
    font-size:12.5px;
    color:var(--ink-soft);
    font-style:italic;
  }
  .footnote b{ color:var(--accent); font-style:normal; }

  .app-footer{
    text-align:center;
    color:var(--ink-faint);
    font-size:11.5px;
    padding:30px 20px 40px 20px;
  }

  /* ---------- write-action controls (buttons / inline forms) ---------- */
  .ledger-btn{
    font-family:Cambria, Georgia, serif;
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--accent);
    background:var(--paper-card);
    border:1px solid var(--rule-strong);
    border-radius:3px;
    padding:7px 16px;
    cursor:pointer;
  }
  .ledger-btn:hover:not(:disabled){ background:var(--accent-tint); border-color:var(--accent); color:var(--accent-soft); }
  .ledger-btn:active:not(:disabled){ transform:translateY(1px); }
  .ledger-btn:disabled{ opacity:.55; cursor:default; }
  .ledger-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .ledger-btn-sm{ font-size:10.5px; padding:4px 10px; }
  .ledger-btn-ghost{ background:transparent; color:var(--ink-soft); border-color:var(--rule-strong); }
  .ledger-btn-ghost:hover:not(:disabled){ background:#efe8d6; color:var(--ink); }

  .inline-error-msg{
    color:var(--accent);
    background:var(--accent-tint);
    border:1px dashed var(--rule-strong);
    padding:8px 12px;
    font-size:12.5px;
    border-radius:2px;
  }
  .inline-error-msg-sm{ margin-top:6px; font-size:10.5px; padding:4px 7px; }

  .doc-action-row{
    margin-top:18px;
    padding-top:14px;
    border-top:1px solid var(--rule);
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
  }

  .schedule-controls-row{ display:flex; gap:12px; flex-wrap:wrap; }
  .schedule-controls .footnote{ margin-top:14px; }
  .schedule-controls .inline-error-msg{ margin-top:14px; }
  .slot-status-col{ text-align:right; min-width:150px; }
  .slot-action-col{ text-align:right; min-width:120px; flex:0 0 auto; }
  .slot-done-mark{ color:var(--good); font-family:Cambria, Georgia, serif; font-weight:700; font-size:12.5px; letter-spacing:.04em; }

  .form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(190px,1fr));
    gap:14px 18px;
    margin-bottom:14px;
  }
  .form-grid label{
    display:flex;
    flex-direction:column;
    gap:5px;
    font-size:11px;
    letter-spacing:.07em;
    text-transform:uppercase;
    color:var(--ink-faint);
  }
  .form-grid label[hidden]{ display:none; }
  .form-grid select, .form-grid input{
    font-family:-apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size:14px;
    color:var(--ink);
    background:var(--paper);
    border:1px solid var(--rule-strong);
    border-radius:3px;
    padding:7px 9px;
  }
  .form-grid select:focus, .form-grid input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .form-actions{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }

  /* ---------- inline line-item editor (raise invoice) ---------- */
  .line-field{
    font-family:-apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size:14px;
    color:var(--ink);
    background:var(--paper);
    border:1px solid var(--rule-strong);
    border-radius:3px;
    padding:6px 8px;
    width:100%;
  }
  .line-field:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .line-field-num{ width:90px; text-align:right; }
  .running-total-row{
    display:flex;
    justify-content:flex-end;
    align-items:baseline;
    gap:14px;
    margin:4px 0 14px 0;
    padding-top:10px;
    border-top:1px solid var(--rule);
  }
  .running-total-row .label{ font-size:12px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-faint); }
  .running-total-row .value{ font-family:Cambria, Georgia, serif; font-size:19px; font-weight:700; color:var(--accent); }

  /* ================= motion layer (fx) =================
     Physical-paper motion language: sheets land, rows are written in,
     totals are ruled off, stamps slam. Transform/opacity only. */

  /* tabs: binder-tab press feel */
  .tab{ transition: background-color .12s ease, color .12s ease, transform .16s ease; }
  .tab:not(.active):hover{ transform: translateY(-1px); }
  .tab:not(.active):active{ transform: translateY(1px); }

  /* paper lift on hover */
  .sheet, .document{ transition: transform .18s ease, box-shadow .18s ease; }
  .sheet:hover{ transform: translateY(-2px); box-shadow: 0 2px 4px rgba(0,0,0,.05), 0 14px 30px rgba(42,36,29,.09); }
  .document:hover{ transform: translateY(-2px); box-shadow: 0 2px 4px rgba(0,0,0,.05), 0 16px 34px rgba(42,36,29,.11); }

  /* sheets slide in and settle (staggered via --i set by JS) */
  .sheet-in{ animation: fxSheetIn .42s cubic-bezier(.23,1,.32,1) backwards; animation-delay: calc(var(--i,0)*60ms); }
  @keyframes fxSheetIn{ from{ opacity:0; transform: translateY(14px) rotate(-.3deg); } }

  /* ledger rows write themselves in (staggered via --r, inherits --i) */
  .row-in{ animation: fxRowIn .3s ease-out backwards; animation-delay: calc(var(--i,0)*60ms + 140ms + var(--r,0)*25ms); }
  @keyframes fxRowIn{ from{ opacity:0; transform: translateX(-6px); } }

  /* clickable row: accent margin tick */
  table.ledger tr.clickable td:first-child{ position:relative; }
  table.ledger tr.clickable td:first-child::before{
    content:''; position:absolute; left:0; top:22%; bottom:22%; width:3px;
    border-radius:2px; background:var(--accent);
    opacity:0; transform:scaleY(.4);
    transition: opacity .15s ease, transform .15s ease;
  }
  table.ledger tr.clickable:hover td:first-child::before{ opacity:.75; transform:scaleY(1); }

  /* crumb: second rule draws itself under the link (double rule on hover) */
  .crumb button{
    background-image:linear-gradient(var(--accent), var(--accent));
    background-repeat:no-repeat; background-size:0% 2px; background-position:0 100%;
    transition: background-size .2s ease; padding-bottom:1px;
  }
  .crumb button:hover{ background-size:100% 2px; }

  /* loading: typewriter ellipsis */
  .loading-msg .dots span{ opacity:0; animation: fxDot 1.2s ease-in-out infinite; }
  .loading-msg .dots span:nth-child(2){ animation-delay:.2s; }
  .loading-msg .dots span:nth-child(3){ animation-delay:.4s; }
  @keyframes fxDot{ 0%{opacity:0;} 30%,70%{opacity:1;} 100%{opacity:0;} }

  /* error: paper dropped on the desk, QUERY stamp in the corner */
  .error-msg{ position:relative; }
  .error-in{ transform: rotate(-.5deg); animation: fxErrorDrop .4s cubic-bezier(.23,1,.32,1) backwards; padding-right:96px; }
  @keyframes fxErrorDrop{ from{ opacity:0; transform: translateY(-10px) rotate(-1.4deg); } }
  .error-in::after{
    content:'QUERY'; position:absolute; top:10px; right:14px;
    font-family:Cambria, Georgia, serif; font-size:11px; font-weight:700; letter-spacing:.14em;
    color:var(--accent); border:2px solid var(--accent); border-radius:3px; padding:2px 8px;
    transform:rotate(7deg); opacity:.7;
    animation: fxQueryIn .18s ease-out .25s backwards;
  }
  @keyframes fxQueryIn{ from{ opacity:0; transform: rotate(7deg) scale(1.4); } }

  /* PAID/UNPAID stamp: CSS slam (fallback + default) */
  .stamp-anim{ animation: fxStampSlam .5s cubic-bezier(.2,1.4,.4,1) .45s backwards; }
  @keyframes fxStampSlam{
    0%{ opacity:0; transform: rotate(-4deg) scale(2.4); }
    55%{ opacity:.92; transform: rotate(-11.6deg) scale(.94); }
    78%{ transform: rotate(-10.7deg) scale(1.03); }
    100%{ opacity:.85; transform: rotate(-11deg) scale(1); }
  }
  .stamp-wait{ opacity:0; }
  .stamp-imprint{ animation: fxImprint .18s ease-out backwards; }
  @keyframes fxImprint{ from{ opacity:0; transform: rotate(-11deg) scale(1.14); } }
  .stamp-anim::after, .stamp-imprint::after{
    content:''; position:absolute; inset:-12px;
    border:2px solid currentColor; border-radius:10px;
    opacity:0; pointer-events:none;
    animation: fxRing .4s ease-out .78s;
  }
  .stamp-imprint::after{ animation-delay:.05s; }
  @keyframes fxRing{ 0%{ opacity:.35; transform:scale(.75);} 100%{ opacity:0; transform:scale(1.2);} }

  /* the sheet takes the blow */
  .doc-thump{ animation: fxThump .22s ease-out; }
  @keyframes fxThump{ 0%{ transform:none; } 45%{ transform: translateY(1px) scale(.998); } 100%{ transform:none; } }

  /* totals ruled off: double underline draws after the figure is inked */
  .summary-row.grand.rule-wait{ border-bottom-color: transparent; position:relative; }
  .summary-row.grand.rule-wait::after{
    content:''; position:absolute; left:0; right:0; bottom:0; height:0;
    border-bottom:3px double var(--ink); transform:scaleX(0); transform-origin:left;
  }
  .summary-row.grand.rule-wait.rule-drawn::after{ animation: fxRule .45s ease-out forwards; }
  tr.row-grand.rule-wait td{ border-bottom-color: transparent !important; position:relative; }
  tr.row-grand.rule-wait td::after{
    content:''; position:absolute; left:0; right:0; bottom:0; height:0;
    border-bottom:3px double var(--ink); transform:scaleX(0); transform-origin:left;
  }
  tr.row-grand.rule-wait.rule-drawn td::after{ animation: fxRule .3s ease-out forwards; }
  tr.row-grand.rule-wait.rule-drawn td:nth-child(2)::after{ animation-delay:.28s; }
  @keyframes fxRule{ to{ transform:scaleX(1); } }

  /* ink blot click feedback */
  .ink-blot{
    position:fixed; width:16px; height:16px; margin:-8px 0 0 -8px;
    border-radius:50%; pointer-events:none; z-index:99;
    background:radial-gradient(circle, rgba(110,20,35,.4), rgba(110,20,35,0) 70%);
    animation: fxBlot .45s ease-out forwards;
  }
  @keyframes fxBlot{ from{ transform:scale(.4); opacity:1; } to{ transform:scale(3); opacity:0; } }

  /* three.js stamp overlay canvas */
  .stamp3d{ position:absolute; pointer-events:none; z-index:3; }

  /* calm fallback: everything lands instantly, nothing is lost */
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:.01ms !important;
      animation-delay:0ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.01ms !important;
    }
  }
</style>
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <div>
      <div class="brand-name">Thornbury Systems</div>
      <div class="brand-tagline">Billing &amp; Job Scheduling for Water Utilities</div>
      <div class="brand-version" id="versionTag"></div>
    </div>
    <nav class="tabs" id="mainNav">
      <button class="tab" data-section="overview">Overview</button>
      <button class="tab" data-section="customers">Customers</button>
      <button class="tab" data-section="invoices">Invoices</button>
      <button class="tab" data-section="schedule">Schedule</button>
    </nav>
  </div>
</header>

<main class="content" id="content"></main>

<footer class="app-footer">Thornbury Systems &middot; billing &amp; job scheduling for water utilities</footer>

<script>
(function(){

  var VAT_NOTE = 'VAT: 20% on engineer services, water supply zero-rated &mdash; policy pending Finance confirmation.';

  function ApiError(message){
    this.message = message;
    this.name = 'ApiError';
  }
  ApiError.prototype = Object.create(Error.prototype);

  async function fetchJSON(path){
    var res;
    try {
      res = await fetch(path, { headers: { 'Accept': 'application/json' } });
    } catch (networkErr) {
      throw new ApiError('The Thornbury API is not responding — is the app running?');
    }
    if (res.status === 404) {
      var body = null;
      try { body = await res.json(); } catch (e) { /* ignore parse failure on error body */ }
      throw new ApiError((body && body.error) ? body.error : 'Not found.');
    }
    if (!res.ok) {
      throw new ApiError('The Thornbury API is not responding — is the app running?');
    }
    try {
      return await res.json();
    } catch (parseErr) {
      throw new ApiError('The Thornbury API returned something unexpected.');
    }
  }

  // POST helper mirroring fetchJSON: JSON body when given, error bodies parsed for message.
  async function postJSON(path, body){
    var res;
    var opts = { method:'POST', headers:{ 'Accept':'application/json' } };
    if (body !== undefined){
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(body);
    }
    try {
      res = await fetch(path, opts);
    } catch (networkErr) {
      throw new ApiError('The Thornbury API is not responding — is the app running?');
    }
    var parsed = null;
    try { parsed = await res.json(); } catch (e) { /* no body, or not JSON */ }
    if (!res.ok) {
      throw new ApiError((parsed && parsed.error) ? parsed.error : 'The Thornbury API returned something unexpected.');
    }
    return parsed;
  }

  function byId(list, id){ for (var i=0;i<list.length;i++){ if (list[i].id===id) return list[i]; } return null; }

  // Mirrors the server's shared/money.ts format(): integer maths only, no floats.
  function money(pence){
    var negative = pence < 0;
    var abs = Math.abs(pence);
    var whole = Math.floor(abs/100);
    var part = abs%100;
    return (negative?'-':'') + '£' + whole.toLocaleString('en-GB') + '.' + String(part).padStart(2,'0');
  }

  function dateLong(iso){
    var d = new Date(iso+'T00:00:00');
    var days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    var months=['January','February','March','April','May','June','July','August','September','October','November','December'];
    return days[d.getDay()] + ' ' + d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
  }
  function dateShort(iso){
    var d = new Date(iso+'T00:00:00');
    var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
  }
  // Today's date on the UK calendar (Europe/London), as YYYY-MM-DD.
  function ukToday(){
    return new Intl.DateTimeFormat('en-CA', { timeZone:'Europe/London' }).format(new Date());
  }
  var UK_DATETIME = new Intl.DateTimeFormat('en-GB', {
    timeZone:'Europe/London', day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit', hourCycle:'h23'
  });
  function formatDateTimeUK(iso){ return UK_DATETIME.format(new Date(iso)); }

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // Light address normalisation, used only to explain (not decide) a
  // not-dispatched work order in the schedule footnote.
  function normalizeAddr(address){
    return String(address).toLowerCase().replace(/[,.]/g,'').trim().replace(/\s+/g,' ');
  }

  var state = { section:'overview', customerId:null, invoiceId:null, _backToCustomer:null, scheduleMsg:null };

  function setSection(section){
    state.section = section;
    state.customerId = null;
    state.invoiceId = null;
    render();
  }
  function openCustomer(id){ state.section='customers'; state.customerId=id; state.invoiceId=null; render(); }
  function openInvoice(id, fromCustomer){ state.invoiceId=id; state.section='invoices'; state._backToCustomer = fromCustomer || null; render(); }

  function errorBlock(err){
    var msg = (err && err.message) ? err.message : 'Something went wrong.';
    return '<div class="sheet sheet-in"><div class="error-msg error-in">'+esc(msg)+'</div></div>';
  }

  var renderToken = 0;
  async function render(){
    document.querySelectorAll('.tab').forEach(function(t){
      t.classList.toggle('active', t.getAttribute('data-section')===state.section);
    });
    var myToken = ++renderToken;
    var el = document.getElementById('content');
    // Only show the loading state if the fetch is actually slow — keeps
    // fast navigations paint-fast and flicker-free.
    var loadTimer = setTimeout(function(){
      if (myToken !== renderToken) return;
      el.innerHTML = '<div class="loading-msg">Entering into ledger<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>';
    }, 120);
    var html;
    try {
      if (state.section==='overview') html = await renderOverview();
      else if (state.section==='customers') html = state.customerId ? await renderCustomerDetail(state.customerId) : await renderCustomerIndex();
      else if (state.section==='invoices') html = state.invoiceId ? await renderInvoiceDetail(state.invoiceId) : await renderInvoiceIndex();
      else if (state.section==='schedule') html = await renderSchedule();
      else html = '';
    } catch (err) {
      clearTimeout(loadTimer);
      if (myToken !== renderToken) return;
      el.innerHTML = errorBlock(err);
      return;
    }
    clearTimeout(loadTimer);
    if (myToken !== renderToken) return; // superseded by a newer navigation
    el.innerHTML = html;
    animateIn(el);
    animateNumbers(el);
    orchestrateStamp(el);
    wireRows();
    wireActions();
    window.scrollTo(0,0);
  }

  function wireRows(){
    document.querySelectorAll('[data-open-customer]').forEach(function(r){
      r.addEventListener('click', function(ev){ inkBlot(ev); openCustomer(r.getAttribute('data-open-customer')); });
    });
    document.querySelectorAll('[data-open-invoice]').forEach(function(r){
      r.addEventListener('click', function(ev){ inkBlot(ev); openInvoice(r.getAttribute('data-open-invoice'), r.getAttribute('data-from-customer')); });
    });
    document.querySelectorAll('[data-back]').forEach(function(r){
      r.addEventListener('click', function(){
        var target = r.getAttribute('data-back');
        if (target==='customers'){ state.customerId=null; state.invoiceId=null; render(); }
        else if (target==='invoices'){ state.invoiceId=null; render(); }
        else if (target==='customer'){ state.invoiceId=null; state.section='customers'; state.customerId=state._backToCustomer; render(); }
      });
    });
  }

  /* ---------------- write actions ----------------
     Every action: disables its trigger with an in-progress label, POSTs via
     postJSON, and on success calls render() so the page re-fetches through
     the normal render() path (never a local cache patch). On failure the
     control re-enables and an in-theme inline error appears next to it —
     no alert(), no page reload. */

  function wireActions(){
    document.querySelectorAll('[data-pay-invoice]').forEach(function(btn){
      btn.addEventListener('click', function(){ payInvoice(btn); });
    });
    document.querySelectorAll('[data-run-dispatch]').forEach(function(btn){
      btn.addEventListener('click', function(){ runDispatch(btn); });
    });
    document.querySelectorAll('[data-complete-wo]').forEach(function(btn){
      btn.addEventListener('click', function(){ completeWorkOrder(btn); });
    });
    document.querySelectorAll('[data-open-raise-wo]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var panel = document.querySelector('[data-raise-wo-panel]');
        if (panel) panel.hidden = !panel.hidden;
      });
    });
    document.querySelectorAll('[data-raise-wo-cancel]').forEach(function(btn){
      btn.addEventListener('click', function(){ closeRaiseWorkOrder(); });
    });
    document.querySelectorAll('[data-raise-requires]').forEach(function(sel){
      sel.addEventListener('change', function(){
        var isOther = sel.value === '__other__';
        var wrap = document.querySelector('[data-raise-requires-other-wrap]');
        var input = document.querySelector('[data-raise-requires-other]');
        if (wrap) wrap.hidden = !isOther;
        if (input) input.required = isOther;
      });
    });
    document.querySelectorAll('[data-raise-wo-form]').forEach(function(form){
      form.addEventListener('submit', function(ev){
        ev.preventDefault();
        submitRaiseWorkOrder(form);
      });
    });

    document.querySelectorAll('[data-open-new-cust]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var panel = document.querySelector('[data-new-cust-panel]');
        if (panel) panel.hidden = !panel.hidden;
      });
    });
    document.querySelectorAll('[data-new-cust-cancel]').forEach(function(btn){
      btn.addEventListener('click', function(){ closeNewCustomer(); });
    });
    document.querySelectorAll('[data-new-cust-form]').forEach(function(form){
      form.addEventListener('submit', function(ev){
        ev.preventDefault();
        submitNewCustomer(form);
      });
    });

    document.querySelectorAll('[data-open-amend-cust]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var panel = document.querySelector('[data-amend-cust-panel]');
        if (panel) panel.hidden = !panel.hidden;
      });
    });
    document.querySelectorAll('[data-amend-cust-cancel]').forEach(function(btn){
      btn.addEventListener('click', function(){ closeAmendCustomer(); });
    });
    document.querySelectorAll('[data-amend-cust-form]').forEach(function(form){
      form.addEventListener('submit', function(ev){
        ev.preventDefault();
        submitAmendCustomer(form);
      });
    });

    document.querySelectorAll('[data-open-raise-inv]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var panel = document.querySelector('[data-raise-inv-panel]');
        if (panel) panel.hidden = !panel.hidden;
      });
    });
    document.querySelectorAll('[data-raise-inv-cancel]').forEach(function(btn){
      btn.addEventListener('click', function(){ closeRaiseInvoice(); });
    });
    document.querySelectorAll('[data-inv-add-line]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var tbody = document.querySelector('[data-inv-lines]');
        if (tbody){ tbody.insertAdjacentHTML('beforeend', invLineRowHtml()); }
        updateInvoiceTotal();
      });
    });
    document.querySelectorAll('[data-inv-lines]').forEach(function(tbody){
      tbody.addEventListener('click', function(ev){
        var btn = ev.target.closest('[data-inv-line-remove]');
        if (!btn) return;
        var row = btn.closest('[data-inv-line-row]');
        if (row && row.parentNode) row.parentNode.removeChild(row);
        updateInvoiceTotal();
      });
      tbody.addEventListener('input', function(ev){
        if (ev.target.matches('[data-inv-line-qty], [data-inv-line-unit]')) updateInvoiceTotal();
      });
    });
    document.querySelectorAll('[data-raise-inv-form]').forEach(function(form){
      form.addEventListener('submit', function(ev){
        ev.preventDefault();
        submitRaiseInvoice(form);
      });
    });
  }

  function closeRaiseWorkOrder(){
    var panel = document.querySelector('[data-raise-wo-panel]');
    var form = document.querySelector('[data-raise-wo-form]');
    if (form) form.reset();
    var wrap = document.querySelector('[data-raise-requires-other-wrap]');
    if (wrap) wrap.hidden = true;
    var errEl = document.querySelector('[data-raise-wo-error]');
    if (errEl){ errEl.hidden = true; errEl.textContent = ''; }
    if (panel) panel.hidden = true;
  }

  function closeNewCustomer(){
    var panel = document.querySelector('[data-new-cust-panel]');
    var form = document.querySelector('[data-new-cust-form]');
    if (form) form.reset();
    var errEl = document.querySelector('[data-new-cust-error]');
    if (errEl){ errEl.hidden = true; errEl.textContent = ''; }
    if (panel) panel.hidden = true;
  }

  function closeAmendCustomer(){
    var panel = document.querySelector('[data-amend-cust-panel]');
    var form = document.querySelector('[data-amend-cust-form]');
    if (form) form.reset();
    var errEl = document.querySelector('[data-amend-cust-error]');
    if (errEl){ errEl.hidden = true; errEl.textContent = ''; }
    if (panel) panel.hidden = true;
  }

  // One empty line row: the starting state for a freshly opened/reset invoice panel.
  function invLineRowHtml(){
    return '<tr data-inv-line-row>'
      + '<td><input type="text" class="line-field" data-inv-line-desc placeholder="Description" required></td>'
      + '<td class="num"><input type="number" class="line-field line-field-num" data-inv-line-qty min="1" step="1" value="1" required></td>'
      + '<td class="num"><input type="number" class="line-field line-field-num" data-inv-line-unit min="1" step="1" placeholder="e.g. 1250" required></td>'
      + '<td><select class="line-field" data-inv-line-kind>'
        + '<option value="SUPPLY">Supply</option>'
        + '<option value="SERVICE">Service</option>'
      + '</select></td>'
      + '<td><button type="button" class="ledger-btn ledger-btn-sm ledger-btn-ghost" data-inv-line-remove>Remove</button></td>'
    + '</tr>';
  }

  // Integer maths only: qty * unitPence per row, summed. Invalid/incomplete
  // rows contribute zero rather than throwing, so typing mid-edit is calm.
  function updateInvoiceTotal(){
    var totalEl = document.querySelector('[data-inv-total]');
    if (!totalEl) return;
    var total = 0;
    document.querySelectorAll('[data-inv-line-row]').forEach(function(row){
      var qty = parseInt(row.querySelector('[data-inv-line-qty]').value, 10);
      var unit = parseInt(row.querySelector('[data-inv-line-unit]').value, 10);
      if (Number.isInteger(qty) && qty > 0 && Number.isInteger(unit) && unit > 0){
        total += qty * unit;
      }
    });
    totalEl.textContent = money(total);
  }

  function closeRaiseInvoice(){
    var panel = document.querySelector('[data-raise-inv-panel]');
    var form = document.querySelector('[data-raise-inv-form]');
    if (form) form.reset();
    var tbody = document.querySelector('[data-inv-lines]');
    if (tbody) tbody.innerHTML = invLineRowHtml();
    updateInvoiceTotal();
    var errEl = document.querySelector('[data-raise-inv-error]');
    if (errEl){ errEl.hidden = true; errEl.textContent = ''; }
    if (panel) panel.hidden = true;
  }

  async function payInvoice(btn){
    var id = btn.getAttribute('data-pay-invoice');
    var row = btn.closest('.doc-action-row');
    var errEl = row ? row.querySelector('[data-pay-error]') : null;
    if (errEl){ errEl.hidden = true; errEl.textContent = ''; }
    btn.disabled = true;
    var original = btn.textContent;
    btn.textContent = 'Recording payment…';
    try {
      await postJSON('/invoices/'+encodeURIComponent(id)+'/pay');
      render();
    } catch (err) {
      btn.disabled = false;
      btn.textContent = original;
      if (errEl){ errEl.textContent = (err && err.message) || 'Something went wrong.'; errEl.hidden = false; }
    }
  }

  async function runDispatch(btn){
    var panel = btn.closest('.schedule-controls');
    var errEl = panel ? panel.querySelector('[data-dispatch-error]') : null;
    if (errEl){ errEl.hidden = true; errEl.textContent = ''; }
    btn.disabled = true;
    var original = btn.textContent;
    btn.textContent = 'Dispatching…';
    try {
      var result = await postJSON('/dispatch/run');
      var n = (result && typeof result.dispatched === 'number') ? result.dispatched : 0;
      state.scheduleMsg = n + ' visit' + (n === 1 ? '' : 's') + ' dispatched.';
      render();
    } catch (err) {
      btn.disabled = false;
      btn.textContent = original;
      if (errEl){ errEl.textContent = (err && err.message) || 'Something went wrong.'; errEl.hidden = false; }
    }
  }

  async function completeWorkOrder(btn){
    var id = btn.getAttribute('data-complete-wo');
    var errEl = btn.parentElement ? btn.parentElement.querySelector('[data-wo-error]') : null;
    if (errEl){ errEl.hidden = true; errEl.textContent = ''; }
    btn.disabled = true;
    var original = btn.textContent;
    btn.textContent = 'Marking done…';
    try {
      await postJSON('/work-orders/'+encodeURIComponent(id)+'/complete');
      render();
    } catch (err) {
      btn.disabled = false;
      btn.textContent = original;
      if (errEl){ errEl.textContent = (err && err.message) || 'Something went wrong.'; errEl.hidden = false; }
    }
  }

  async function submitRaiseWorkOrder(form){
    var errEl = form.querySelector('[data-raise-wo-error]');
    var submitBtn = form.querySelector('button[type="submit"]');
    var cancelBtn = form.querySelector('[data-raise-wo-cancel]');
    if (errEl){ errEl.hidden = true; errEl.textContent = ''; }

    var customerId = form.elements.customerId.value;
    var requiresSel = form.elements.requires.value;
    var requiresOther = form.elements.requiresOther ? form.elements.requiresOther.value.trim() : '';
    var requires = requiresSel === '__other__' ? requiresOther : requiresSel;
    var whenLocal = form.elements.requestedAt.value;
    var duration = Number(form.elements.durationMinutes.value);

    if (!customerId || !requires || !whenLocal || !isFinite(duration) || duration <= 0){
      errEl.textContent = 'Fill in every field before raising the work order.';
      errEl.hidden = false;
      return;
    }
    var requestedAtIso;
    try { requestedAtIso = new Date(whenLocal).toISOString(); }
    catch (e) { errEl.textContent = 'That date and time is not valid.'; errEl.hidden = false; return; }

    submitBtn.disabled = true;
    if (cancelBtn) cancelBtn.disabled = true;
    var original = submitBtn.textContent;
    submitBtn.textContent = 'Raising…';
    try {
      await postJSON('/work-orders', {
        customerId: customerId,
        requires: requires,
        requestedAt: requestedAtIso,
        durationMinutes: duration
      });
      render();
    } catch (err) {
      submitBtn.disabled = false;
      if (cancelBtn) cancelBtn.disabled = false;
      submitBtn.textContent = original;
      errEl.textContent = (err && err.message) || 'Something went wrong.';
      errEl.hidden = false;
    }
  }

  async function submitNewCustomer(form){
    var errEl = form.querySelector('[data-new-cust-error]');
    var submitBtn = form.querySelector('button[type="submit"]');
    var cancelBtn = form.querySelector('[data-new-cust-cancel]');
    if (errEl){ errEl.hidden = true; errEl.textContent = ''; }

    var name = form.elements.name.value.trim();
    var address = form.elements.address.value.trim();
    var accountType = form.elements.accountType.value;
    var vatRegistered = form.elements.vatRegistered.checked;

    if (!name || !address || !accountType){
      errEl.textContent = 'Fill in every field before creating the customer.';
      errEl.hidden = false;
      return;
    }

    submitBtn.disabled = true;
    if (cancelBtn) cancelBtn.disabled = true;
    var original = submitBtn.textContent;
    submitBtn.textContent = 'Creating…';
    try {
      await postJSON('/customers', {
        name: name,
        address: address,
        accountType: accountType,
        vatRegistered: vatRegistered
      });
      render();
    } catch (err) {
      submitBtn.disabled = false;
      if (cancelBtn) cancelBtn.disabled = false;
      submitBtn.textContent = original;
      errEl.textContent = (err && err.message) || 'Something went wrong.';
      errEl.hidden = false;
    }
  }

  async function submitAmendCustomer(form){
    var errEl = form.querySelector('[data-amend-cust-error]');
    var submitBtn = form.querySelector('button[type="submit"]');
    var cancelBtn = form.querySelector('[data-amend-cust-cancel]');
    if (errEl){ errEl.hidden = true; errEl.textContent = ''; }

    var name = form.elements.name.value.trim();
    var address = form.elements.address.value.trim();

    if (!name || !address){
      errEl.textContent = 'Name and address cannot be empty.';
      errEl.hidden = false;
      return;
    }

    submitBtn.disabled = true;
    if (cancelBtn) cancelBtn.disabled = true;
    var original = submitBtn.textContent;
    submitBtn.textContent = 'Saving…';
    try {
      await postJSON('/customers/'+encodeURIComponent(state.customerId)+'/update', { name: name, address: address });
      render();
    } catch (err) {
      submitBtn.disabled = false;
      if (cancelBtn) cancelBtn.disabled = false;
      submitBtn.textContent = original;
      errEl.textContent = (err && err.message) || 'Something went wrong.';
      errEl.hidden = false;
    }
  }

  async function submitRaiseInvoice(form){
    var errEl = form.querySelector('[data-raise-inv-error]');
    var submitBtn = form.querySelector('button[type="submit"]');
    var cancelBtn = form.querySelector('[data-raise-inv-cancel]');
    var addBtn = form.querySelector('[data-inv-add-line]');
    var removeBtns = form.querySelectorAll('[data-inv-line-remove]');
    if (errEl){ errEl.hidden = true; errEl.textContent = ''; }

    var rows = form.querySelectorAll('[data-inv-line-row]');
    var lines = [];
    var allValid = true;
    rows.forEach(function(row){
      var description = row.querySelector('[data-inv-line-desc]').value.trim();
      var quantity = Number(row.querySelector('[data-inv-line-qty]').value);
      var unitPence = Number(row.querySelector('[data-inv-line-unit]').value);
      var kind = row.querySelector('[data-inv-line-kind]').value;
      if (!description || !Number.isInteger(quantity) || quantity <= 0 || !Number.isInteger(unitPence) || unitPence <= 0){
        allValid = false;
        return;
      }
      lines.push({ description: description, quantity: quantity, unitPence: unitPence, kind: kind });
    });

    if (!allValid || lines.length === 0){
      errEl.textContent = 'Every line needs a description, a whole-number quantity, and a whole-number unit price in pence.';
      errEl.hidden = false;
      return;
    }

    submitBtn.disabled = true;
    if (cancelBtn) cancelBtn.disabled = true;
    if (addBtn) addBtn.disabled = true;
    removeBtns.forEach(function(b){ b.disabled = true; });
    var original = submitBtn.textContent;
    submitBtn.textContent = 'Raising…';
    try {
      var custSel = form.querySelector('[data-raise-inv-customer]');
      var customerId = custSel ? custSel.value : state.customerId;

      if (cancelBtn) cancelBtn.disabled = false;
      if (addBtn) addBtn.disabled = false;
      removeBtns.forEach(function(b){ b.disabled = false; });

    }

  /* ---------------- motion / fx layer ----------------
     Entry-based only: #content is rebuilt wholesale on every navigation, so
     every effect is applied as classes/vars after the innerHTML swap.
     Values are never touched: counters read data-pence/data-count and always
     restore the exact server-rendered text on the final frame. */

  function fxReduced(){
    return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  // Sheets land with a stagger; rows write themselves in (capped for readability).
  function animateIn(root){
    Array.prototype.forEach.call(root.children, function(node, idx){
      node.classList.add('sheet-in');
      node.style.setProperty('--i', idx);
    });
    root.querySelectorAll('table.ledger tbody').forEach(function(tb){
      Array.prototype.slice.call(tb.rows, 0, 15).forEach(function(tr, r){
        tr.classList.add('row-in');
        tr.style.setProperty('--r', r);
      });
    });
    var parentCounts = [];
    root.querySelectorAll('.slot-row, .summary-row').forEach(function(row){
      var p = row.parentNode, entry = null;
      for (var i=0;i<parentCounts.length;i++){ if (parentCounts[i].p===p){ entry=parentCounts[i]; break; } }
      if (!entry){ entry = { p:p, n:0 }; parentCounts.push(entry); }
      if (entry.n < 15){ row.classList.add('row-in'); row.style.setProperty('--r', entry.n); }
      entry.n++;
    });
  }

  // Money and KPI figures tick up (integer pence, existing money() formatter),
  // then the double underline rules the total off.
  function animateNumbers(root){
    if (fxReduced()) return;
    root.querySelectorAll('.summary-row.grand, tr.row-grand').forEach(function(row){
      if (row.querySelector('[data-pence]')) row.classList.add('rule-wait');
    });
    root.querySelectorAll('[data-pence], [data-count]').forEach(function(elm){
      var isPence = elm.hasAttribute('data-pence');
      var target = Number(elm.getAttribute(isPence ? 'data-pence' : 'data-count'));
      var finalText = elm.textContent;
      var ruleRow = elm.closest('.rule-wait');
      function finish(){
        elm.textContent = finalText; // exact server value, always
        if (ruleRow && ruleRow.isConnected) ruleRow.classList.add('rule-drawn');
      }
      if (!isFinite(target)){ finish(); return; }
      var start = null, dur = 520;
      function frame(now){
        if (!elm.isConnected) return; // superseded by a newer navigation
        if (start === null) start = now;
        var t = Math.min(1, (now - start) / dur);
        var eased = 1 - Math.pow(1 - t, 3);
        if (t < 1){
          var v = Math.round(target * eased);
          elm.textContent = isPence ? money(v) : String(v);
          requestAnimationFrame(frame);
        } else {
          finish();
        }
      }
      requestAnimationFrame(frame);
    });
  }

  // Ink blot at the click point.
  function inkBlot(ev){
    if (fxReduced() || !ev || !ev.clientX) return;
    var b = document.createElement('div');
    b.className = 'ink-blot';
    b.style.left = ev.clientX + 'px';
    b.style.top = ev.clientY + 'px';
    document.body.appendChild(b);
    setTimeout(function(){ if (b.parentNode) b.parentNode.removeChild(b); }, 700);
  }

  /* ---- the stamp moment: three.js rubber stamp with a CSS slam fallback ---- */

  var THREE_URL = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
  var threeLoad = null;
  // Lazy-loaded only on first invoice render; cached for later invoices.
  function loadThree(timeoutMs){
    if (window.THREE) return Promise.resolve(window.THREE);
    if (!threeLoad){
      threeLoad = new Promise(function(resolve, reject){
        var s = document.createElement('script');
        s.src = THREE_URL;
        s.onload = function(){ if (window.THREE) resolve(window.THREE); else reject(new Error('three unavailable')); };
        s.onerror = function(){ reject(new Error('three failed to load')); };
        document.head.appendChild(s);
      });
      threeLoad['catch'](function(){ /* handled per call site */ });
    }
    return new Promise(function(resolve, reject){
      var timer = setTimeout(function(){ reject(new Error('three load timeout')); }, timeoutMs);
      threeLoad.then(function(T){ clearTimeout(timer); resolve(T); },
                     function(e){ clearTimeout(timer); reject(e); });
    });
  }

  function cssSlam(stamp){
    stamp.classList.remove('stamp-wait');
    stamp.classList.add('stamp-anim');
    var docBody = stamp.parentNode ? stamp.parentNode.querySelector('.doc-body') : null;
    setTimeout(function(){ if (docBody && docBody.isConnected) docBody.classList.add('doc-thump'); }, 780);
  }

  function orchestrateStamp(root){
    var stamp = root.querySelector('.document > .stamp');
    if (!stamp) return;
    if (fxReduced()) return; // static stamp, exactly as rendered
    stamp.classList.add('stamp-wait');
    var myToken = renderToken;
    loadThree(1500).then(function(THREE){
      if (myToken !== renderToken || !stamp.isConnected) return;
      try { play3DStamp(THREE, stamp); }
      catch (e) { cssSlam(stamp); } // no WebGL, or anything else — same slam, zero fuss
    }, function(){
      if (myToken === renderToken && stamp.isConnected) cssSlam(stamp);
    });
  }

  // A small transparent canvas over the document: a wooden rubber stamp drops,
  // strikes (the DOM stamp imprints at contact), lifts away, canvas removed.
  function play3DStamp(THREE, stamp){
    var docEl = stamp.parentNode; // .document, position:relative, overflow:hidden
    var W = 260, H = 320;
    var renderer = new THREE.WebGLRenderer({ alpha:true, antialias:true }); // throws without WebGL
    renderer.setSize(W, H);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    var canvas = renderer.domElement;
    canvas.className = 'stamp3d';
    // Centre the strike point on the resting stamp; world origin projects ~78% down the canvas.
    var cx = stamp.offsetLeft + stamp.offsetWidth / 2;
    var cy = stamp.offsetTop + stamp.offsetHeight / 2;
    canvas.style.left = (cx - W / 2) + 'px';
    canvas.style.top = (cy - Math.round(H * 0.78)) + 'px';
    docEl.appendChild(canvas);

    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(35, W / H, 0.1, 50);
    camera.position.set(0.5, 2.0, 3.9);
    camera.lookAt(0, 0.85, 0);
    scene.add(new THREE.AmbientLight(0xfff4e0, 0.85));
    var sun = new THREE.DirectionalLight(0xffffff, 0.7);
    sun.position.set(2, 4, 3);
    scene.add(sun);

    var wood = new THREE.MeshStandardMaterial({ color:0x8a5a33, roughness:.55, metalness:.05 });
    var dark = new THREE.MeshStandardMaterial({ color:0x33261d, roughness:.5, metalness:.1 });
    var rubber = new THREE.MeshStandardMaterial({ color:0x6e1423, roughness:.9, metalness:0 });
    var group = new THREE.Group();
    var knob = new THREE.Mesh(new THREE.SphereGeometry(.26, 24, 16), wood);
    knob.position.y = 1.42;
    var handle = new THREE.Mesh(new THREE.CylinderGeometry(.13, .2, 1.0, 20), wood);
    handle.position.y = 0.82;
    var cap = new THREE.Mesh(new THREE.CylinderGeometry(.58, .62, .16, 28), dark);
    cap.position.y = 0.19;
    var pad = new THREE.Mesh(new THREE.CylinderGeometry(.6, .6, .1, 28), rubber);
    pad.position.y = 0.05;
    group.add(knob); group.add(handle); group.add(cap); group.add(pad);
    group.position.y = 3.2;
    group.rotation.z = -0.22;
    scene.add(group);

    // Soft radial contact shadow (canvas texture, so it fades at the edges).
    var shCanvas = document.createElement('canvas');
    shCanvas.width = shCanvas.height = 64;
    var shCtx = shCanvas.getContext('2d');
    var grad = shCtx.createRadialGradient(32, 32, 4, 32, 32, 32);
    grad.addColorStop(0, 'rgba(42,36,29,0.55)');
    grad.addColorStop(1, 'rgba(42,36,29,0)');
    shCtx.fillStyle = grad;
    shCtx.fillRect(0, 0, 64, 64);
    var shadowMat = new THREE.MeshBasicMaterial({ map:new THREE.CanvasTexture(shCanvas), transparent:true, opacity:0, depthWrite:false });
    var shadow = new THREE.Mesh(new THREE.CircleGeometry(.62, 28), shadowMat);
    shadow.rotation.x = -Math.PI / 2;
    shadow.position.y = 0.001;
    scene.add(shadow);

    var docBody = docEl.querySelector('.doc-body');
    var struck = false;
    var t0 = null;
    var DROP = 380, HOLD = 180, LIFT = 490; // ms
    function cleanup(){
      renderer.dispose();
      if (canvas.parentNode) canvas.parentNode.removeChild(canvas);
    }
    function tick(now){
      if (!canvas.isConnected){ renderer.dispose(); return; } // navigation removed the document
      if (t0 === null) t0 = now;
      var t = now - t0;
      if (t <= DROP){
        var d = t / DROP; d = d * d; // accelerate into the strike
        group.position.y = 3.2 * (1 - d);
        group.rotation.z = -0.22 * (1 - d) - 0.02;
        shadowMat.opacity = 0.55 * d;
        var s = 0.5 + 0.5 * d;
        shadow.scale.set(s, s, 1);
      } else if (t <= DROP + HOLD){
        group.position.y = 0;
        if (!struck){
          struck = true;
          group.scale.y = 0.92; // squash on impact
          stamp.classList.remove('stamp-wait');
          stamp.classList.add('stamp-imprint'); // the ink lands
          if (docBody && docBody.isConnected) docBody.classList.add('doc-thump');
        }
        group.scale.y = Math.min(1, 0.92 + 0.08 * ((t - DROP) / HOLD));
      } else if (t <= DROP + HOLD + LIFT){
        var u = (t - DROP - HOLD) / LIFT;
        var e = 1 - Math.pow(1 - u, 2);
        group.scale.y = 1;
        group.position.y = 1.9 * e;
        group.rotation.z = -0.3 * e;
        shadowMat.opacity = 0.55 * (1 - e);
        canvas.style.opacity = u > 0.4 ? String(1 - (u - 0.4) / 0.6) : '1';
      } else {
        cleanup();
        return;
      }
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

      return '<option value="'+esc(c.id)+'">'+esc(c.name)+' ('+esc(c.id)+')</option>';
    }).join('');
    return ''
      + '<div class="page-head"><h1>Invoice Register</h1><div class="sub">' + invoices.length + ' invoices</div>'
        + '<button type="button" class="ledger-btn ledger-btn-sm" data-open-raise-inv>New invoice</button>'
      + '</div>'
      + '<div class="sheet" data-raise-inv-panel hidden>'
        + '<div class="sheet-title">New invoice</div>'
        + '<form data-raise-inv-form>'
          + '<div class="form-grid"><label>Customer<select class="line-field" name="customer" data-raise-inv-customer required>' + custOptions + '</select></label></div>'
          + '<div class="table-scroll"><table class="ledger">'
            + '<thead><tr><th>Description</th><th class="num">Qty</th><th class="num">Unit price (pence)</th><th>Kind</th><th></th></tr></thead>'
            + '<tbody data-inv-lines>' + invLineRowHtml() + '</tbody>'
          + '</table></div>'
          + '<div class="form-actions" style="margin:12px 0;">'
            + '<button type="button" class="ledger-btn ledger-btn-sm ledger-btn-ghost" data-inv-add-line>Add line</button>'
          + '</div>'
          + '<div class="running-total-row"><span class="label">Running total</span><span class="value" data-inv-total>' + money(0) + '</span></div>'
          + '<div class="inline-error-msg" data-raise-inv-error hidden></div>'
          + '<div class="form-actions">'
            + '<button type="submit" class="ledger-btn">Raise invoice</button>'
            + '<button type="button" class="ledger-btn ledger-btn-ghost" data-raise-inv-cancel>Cancel</button>'
          + '</div>'
        + '</form>'
      + '</div>'
      + '<div class="sheet">'
        + '<div class="table-scroll"><table class="ledger"><thead><tr><th class="id">Invoice</th><th>Customer</th><th>Issued</th><th class="num">Net</th><th class="num">VAT</th><th class="num">Total</th><th>Status</th></tr></thead>'
        + '<tbody>' + rows + '</tbody></table></div>'
      + '</div>';
  }

  async function renderInvoiceDetail(id){

    var customer = await fetchJSON('/customers/'+encodeURIComponent(invoice.customerId));

    var lineRows = invoice.lines.map(function(l){
      return '<tr>'
        + '<td>'+esc(l.description)+'</td>'
        + '<td class="num">'+l.quantity+'</td>'
        + '<td class="num money">'+money(l.unitPence)+'</td>'
        + '<td>'+esc(l.kind)+'</td>'
        + '<td class="num money">'+money(l.quantity*l.unitPence)+'</td>'

    var statusText = invoice.paid ? 'PAID' : 'UNPAID';

    var payAction = invoice.paid ? '' : ''
      + '<div class="doc-action-row">'

        + '<button type="button" class="ledger-btn" data-pay-invoice="'+esc(invoice.id)+'">Record payment</button>'
      + '</div>';

    return ''
      + '<div class="crumb">' + backBtn + '</div>'
      + '<div class="document">'
        + '<div class="stamp ' + (invoice.paid?'is-paid':'is-unpaid') + '">' + statusText + '</div>'
        + '<div class="letterhead">'
          + '<div>'
            + '<div class="co-name">Thornbury Systems</div>'
            + '<div class="co-detail">Unit 3 Waterside Court, Thornbury, South Gloucestershire BS35 2AA<br>Water &amp; Wastewater Services &middot; billing@thornburysystems.example</div>'
          + '</div>'
          + '<div>'
            + '<div class="doc-type">Invoice</div>'
            + '<div class="doc-meta">' + esc(invoice.id) + '<br>Issued ' + dateShort(invoice.issued) + '<br>Account ' + esc(customer.id) + ' &middot; ' + esc(customer.accountType) + '</div>'
          + '</div>'
        + '</div>'
        + '<div class="doc-body">'
          + '<div class="doc-parties">'
            + '<div><div class="to-label">Bill to</div><div class="to-name">'+esc(customer.name)+'</div><address>'+esc(customer.address)+'</address></div>'
          + '</div>'
          + '<div class="table-scroll"><table class="ledger"><thead><tr><th>Description</th><th class="num">Qty</th><th class="num">Unit price</th><th>Kind</th><th class="num">Line net</th></tr></thead>'
          + '<tbody>'
            + lineRows
            + '<tr class="row-total"><td colspan="4">Net</td><td class="num money">'+money(invoice.net)+'</td></tr>'
            + '<tr><td colspan="4">VAT</td><td class="num money">'+money(invoice.vat)+'</td></tr>'
            + '<tr class="row-grand"><td colspan="4">Total due</td><td class="num money"'+(typeof invoice.total==='number'?' data-pence="'+invoice.total+'"':'')+'>'+esc(invoice.display)+'</td></tr>'
          + '</tbody></table></div>'
          + '<div class="vat-note">' + VAT_NOTE + '</div>'
          + payAction
        + '</div>'
        + '<div class="doc-foot">Please make payment within 14 days of the issue date. Queries: 01454 000 000.</div>'
      + '</div>';
  }

  /* ---------------- SCHEDULE ---------------- */
  async function renderSchedule(){
    var results = await Promise.all([
      fetchJSON('/work-orders'), fetchJSON('/slots'), fetchJSON('/dispatch'), fetchJSON('/customers')
    ]);
    var workOrders = results[0], slots = results[1], dispatchList = results[2], customers = results[3];

    var slotByWO = {};
    slots.forEach(function(s){ slotByWO[s.workOrderId] = s; });
    var customerName = {};
    customers.forEach(function(c){ customerName[c.id] = c.name; });

    // Ground truth for "has this work order been dispatched" is the work
    // order's own status/engineerId (set by POST /dispatch/run), not the
    // /dispatch preview endpoint — that recomputes a fresh hypothetical plan
    // from whatever is still QUEUED, so it stops listing an order the moment
    // it is actually committed. dispatchList is kept only for the best-effort
    // "why not dispatched" footnote explanation below.
    function isDispatched(w){ return w.status === 'DISPATCHED' || w.status === 'DONE'; }

    function isOvernight(window){
      var parts = String(window).split(' to ');
      if (parts.length !== 2) return false;
      return parts[1] < parts[0];
    }

    var groups = {};
    workOrders.forEach(function(w){
      var slot = slotByWO[w.id];
      var date = slot ? slot.date : 'unscheduled';
      if (!groups[date]) groups[date] = [];
      groups[date].push(w);
    });
    var dates = Object.keys(groups).sort();

    // Best-effort, computed explanation for a not-dispatched work order —
    // not the decision itself, which /dispatch has already made.
    function reasonFor(w){
      var slot = slotByWO[w.id];
      var norm = normalizeAddr(w.address);
      var match = dispatchList.find(function(a){
        if (a.workOrderId === w.id) return false;
        var otherSlot = slotByWO[a.workOrderId];
        return normalizeAddr(a.address) === norm && slot && otherSlot && otherSlot.date === slot.date;
      });
      if (match) return 'duplicate address, same day as ' + esc(match.workOrderId);
      return 'no engineer or slot available';
    }

    function slotRowHtml(w){
      var slot = slotByWO[w.id];
      var dispatched = isDispatched(w);
      var isDone = w.status === 'DONE';
      var notDispatched = w.status === 'QUEUED';
      var overnightFlag = slot && isOvernight(slot.window);
      var engineerCell = dispatched && w.engineerId ? esc(w.engineerId) : 'Not dispatched';
      var flag = notDispatched ? '<div class="slot-flag">Not dispatched</div>' : '';
      var actionCell = isDone
        ? '<div class="slot-done-mark">&#10003; Done</div>'
        : '<button type="button" class="ledger-btn ledger-btn-sm" data-complete-wo="'+esc(w.id)+'">Mark done</button>'
          + '<div class="inline-error-msg inline-error-msg-sm" data-wo-error hidden></div>';
      return '<div class="slot-row'+(dispatched?'':' not-dispatched')+'">'
        + '<div class="slot-window">' + (slot ? esc(slot.window) : '&mdash;') + (overnightFlag ? ' <span style="font-weight:400;">(overnight)</span>' : '') + '<span class="lbl">customer window</span></div>'
        + '<div class="slot-main">'
          + '<div class="slot-wo">' + esc(w.id) + ' &middot; ' + esc(customerName[w.customerId] || w.customerId) + '</div>'
          + '<div class="slot-addr">' + esc(w.address) + '</div>'
        + '</div>'
        + '<div class="slot-status-col">' + engineerCell + flag + '</div>'
        + '<div class="slot-action-col">' + actionCell + '</div>'
      + '</div>';
    }

    var daySheets = dates.map(function(date){
      var list = groups[date].slice().sort(function(a,b){
        var sa = slotByWO[a.id] ? slotByWO[a.id].window : '';
        var sb = slotByWO[b.id] ? slotByWO[b.id].window : '';
        return sa < sb ? -1 : (sa > sb ? 1 : 0);
      });
      var label = date === 'unscheduled' ? 'Unscheduled' : dateLong(date);
      return '<div class="sheet">'
        + '<div class="day-label">' + esc(label) + ' <span class="count">' + list.length + ' work order' + (list.length===1?'':'s') + '</span></div>'
        + list.map(slotRowHtml).join('')
      + '</div>';
    }).join('');

    var dispatchRows = workOrders.map(function(w){
      var dispatched = isDispatched(w);
      var slot = slotByWO[w.id];
      var overnightFlag = slot && isOvernight(slot.window);
      var engCell = dispatched && w.engineerId ? esc(w.engineerId) : '&mdash;';
      var startCell = dispatched ? (esc(formatDateTimeUK(w.requestedAt)) + (overnightFlag ? '&dagger;' : '')) : '&mdash;';
      return '<tr' + (dispatched?'':' style="opacity:.6;"') + '>'
        + '<td class="id">'+esc(w.id)+'</td>'
        + '<td>'+engCell+'</td>'
        + '<td>'+esc(w.address)+'</td>'
        + '<td class="num">'+startCell+'</td>'
      + '</tr>';
    }).join('');

    var notDispatchedList = workOrders.filter(function(w){ return w.status === 'QUEUED'; });
    var footnoteBody = notDispatchedList.length
      ? notDispatchedList.map(function(w){ return '<b>'+esc(w.id)+'</b> not dispatched &mdash; ' + reasonFor(w); }).join('. ') + '.'
      : 'All queued work orders were dispatched.';

    var dispatchedCount = workOrders.filter(isDispatched).length;

    var dispatchMsgHtml = state.scheduleMsg
      ? '<div class="footnote">' + esc(state.scheduleMsg) + '</div>'
      : '';
    state.scheduleMsg = null; // shown once, on the render that follows the action

    var customerOptions = customers.map(function(c){
      return '<option value="'+esc(c.id)+'">'+esc(c.name)+' ('+esc(c.id)+')</option>';
    }).join('');

    var controlsHtml = ''
      + '<div class="sheet schedule-controls">'
        + '<div class="sheet-title">Day sheet actions</div>'
        + '<div class="schedule-controls-row">'
          + '<button type="button" class="ledger-btn" data-run-dispatch>Run dispatch</button>'
          + '<button type="button" class="ledger-btn" data-open-raise-wo>Raise work order</button>'
        + '</div>'
        + dispatchMsgHtml
        + '<div class="inline-error-msg" data-dispatch-error hidden></div>'
      + '</div>'
      + '<div class="sheet raise-wo-sheet" data-raise-wo-panel hidden>'
        + '<div class="sheet-title">Raise work order</div>'
        + '<form data-raise-wo-form>'
          + '<div class="form-grid">'
            + '<label>Customer'
              + '<select name="customerId" required>'
                + '<option value="" disabled selected>Choose account&hellip;</option>'
                + customerOptions
              + '</select>'
            + '</label>'
            + '<label>Requires'
              + '<select name="requires" data-raise-requires required>'
                + '<option value="METER">Meter</option>'
                + '<option value="LEAK">Leak</option>'
                + '<option value="BACKFLOW">Backflow</option>'
                + '<option value="__other__">Other&hellip;</option>'
              + '</select>'
            + '</label>'
            + '<label data-raise-requires-other-wrap hidden>Describe requirement'
              + '<input type="text" name="requiresOther" data-raise-requires-other placeholder="e.g. Stopcock replacement">'
            + '</label>'
            + '<label>Requested for'
              + '<input type="datetime-local" name="requestedAt" required>'
            + '</label>'
            + '<label>Duration (minutes)'
              + '<input type="number" name="durationMinutes" min="1" step="1" value="60" required>'
            + '</label>'
          + '</div>'
          + '<div class="inline-error-msg" data-raise-wo-error hidden></div>'
          + '<div class="form-actions">'
            + '<button type="submit" class="ledger-btn">Raise work order</button>'
            + '<button type="button" class="ledger-btn ledger-btn-ghost" data-raise-wo-cancel>Cancel</button>'
          + '</div>'
        + '</form>'
      + '</div>';

    return ''
      + '<div class="page-head"><h1>Day Sheet</h1><div class="sub">' + workOrders.length + ' work orders &middot; ' + dispatchedCount + ' visits planned</div></div>'
      + controlsHtml
      + daySheets
      + '<div class="sheet">'
        + '<div class="sheet-title">Dispatch roster</div>'
        + '<div class="table-scroll"><table class="ledger"><thead><tr><th class="id">Work order</th><th>Engineer</th><th>Address</th><th class="num">Start</th></tr></thead>'
        + '<tbody>' + dispatchRows + '</tbody></table></div>'
        + '<div class="footnote">&dagger; Overnight job, start shown in UK local time. ' + footnoteBody + '</div>'
      + '</div>';
  }

  document.getElementById('mainNav').addEventListener('click', function(e){
    var t = e.target.closest('.tab');
    if (t) setSection(t.getAttribute('data-section'));
  });

  window.addEventListener('unhandledrejection', function(ev){ ev.preventDefault(); });

  fetchJSON('/').then(function(info){
    if (info && info.version) {
      var tag = document.getElementById('versionTag');
      if (tag) tag.textContent = 'v' + info.version;
    }
  }).catch(function(){ /* version is a nice-to-have; omit silently if unavailable */ });

  setSection('overview');
})();
</script>
