<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thornbury Ops Console</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --panel-alt: #fafbfc;
    --border: #e3e5e9;
    --border-strong: #cdd1d8;
    --text: #1a1d23;
    --text-dim: #63697a;
    --text-faint: #9aa0ac;
    --accent: #2c4c86;
    --accent-bg: #eaf0fb;
    --accent-border: #c3d3ee;
    --green: #1e7a34;
    --green-bg: #e6f4ea;
    --green-border: #c3e6cb;
    --amber: #8a5a00;
    --amber-bg: #fff4e0;
    --amber-border: #ffe2ad;
    --red: #a4241c;
    --red-bg: #fdecea;
    --red-border: #f3b6ae;
    --gray-bg: #eef0f3;
    --gray-border: #dcdfe4;
    font-size: 13px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
    font-size: 13px; line-height: 1.4;
  }
  #shell { display: flex; height: 100vh; width: 100%; overflow: hidden; }

  /* ---------- sidebar ---------- */
  #sidebar {
    width: 196px; flex: 0 0 196px; background: var(--panel-alt);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
    height: 100%;
  }
  .brand {
    padding: 13px 16px 11px; border-bottom: 1px solid var(--border);
  }
  .brand-name { font-size: 12.5px; font-weight: 700; letter-spacing: .04em; color: var(--text); }
  .brand-sub { font-size: 10.5px; color: var(--text-faint); letter-spacing: .03em; margin-top: 2px; }
  .nav-list { list-style: none; margin: 0; padding: 8px 0; flex: 1; }
  .nav-item {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 7px 16px; font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase;
    color: var(--text-dim); cursor: pointer; border-left: 2px solid transparent;
    user-select: none;
  }
  .nav-item:hover { background: #eef1f5; color: var(--text); }
  .nav-item.active {
    color: var(--accent); border-left-color: var(--accent); background: var(--accent-bg); font-weight: 700;
  }
  .nav-key {
    font-size: 9.5px; color: var(--text-faint); border: 1px solid var(--border-strong);
    border-radius: 3px; padding: 0 4px; font-family: Consolas, monospace; line-height: 1.5;
  }
  .nav-item.active .nav-key { color: var(--accent); border-color: var(--accent-border); }
  .sidebar-footer {
    border-top: 1px solid var(--border); padding: 10px 16px; font-size: 10px; color: var(--text-faint);
  }
  .sidebar-footer strong { color: var(--text-dim); }

  /* ---------- main ---------- */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100%; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 20px; border-bottom: 1px solid var(--border); background: var(--panel);
    flex: 0 0 auto; gap: 16px; flex-wrap: wrap;
  }
  .topbar-title { font-size: 13.5px; font-weight: 700; letter-spacing: .01em; }
  .topbar-meta { font-size: 11px; color: var(--text-faint); margin-top: 1px; }
  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .content { flex: 1; overflow: auto; padding: 16px 20px; }

  /* ---------- generic controls ---------- */
  .btn {
    font-size: 11.5px; padding: 5px 11px; border: 1px solid var(--border-strong);
    background: var(--panel); border-radius: 3px; cursor: pointer; color: var(--text);
    font-family: inherit;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:disabled { background: var(--border-strong); border-color: var(--border-strong); color: #fff; }

  .input {
    font-size: 12px; padding: 5px 9px; border: 1px solid var(--border-strong); border-radius: 3px;
    font-family: inherit; background: var(--panel); color: var(--text); width: 100%;
  }
  .input:focus { outline: none; border-color: var(--accent); }

  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 11.5px; color: var(--text-dim); user-select: none; }
  .switch-track {
    width: 32px; height: 17px; border-radius: 9px; background: var(--border-strong); position: relative; transition: background .12s;
    flex: 0 0 auto;
  }
  .switch-track::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%;
    background: #fff; transition: left .12s; box-shadow: 0 1px 2px rgba(0,0,0,.3);
  }
  .switch.on .switch-track { background: var(--accent); }
  .switch.on .switch-track::after { left: 17px; }
  .switch.on .switch-label { color: var(--accent); font-weight: 600; }

  /* ---------- tables ---------- */
  table.data { width: 100%; border-collapse: collapse; font-size: 12px; background: var(--panel); }
  table.data th {
    text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--text-faint); padding: 7px 10px; border-bottom: 1px solid var(--border-strong);
    white-space: nowrap; font-weight: 600;
  }
  table.data td { padding: 6px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  table.data tbody tr.clickable:hover { background: #f2f5fa; cursor: pointer; }
  table.data tbody tr.selected { background: var(--accent-bg); }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mono { font-family: Consolas, "Courier New", monospace; font-size: 11.5px; }
  .dim { color: var(--text-faint); }
  .foot-row td { border-bottom: none; border-top: 1px solid var(--border-strong); font-weight: 700; background: var(--panel-alt); }

  /* ---------- panels / cards ---------- */
  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 4px; overflow: hidden;
  }
  .panel + .panel { margin-top: 14px; }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 9px 12px; border-bottom: 1px solid var(--border); background: var(--panel-alt);
  }
  .panel-head h2 { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-dim); }
  .panel-body { padding: 12px; }
  .panel-body.pad0 { padding: 0; }
  .table-scroll { max-height: 100%; overflow: auto; }

  .two-col { display: grid; grid-template-columns: 420px 1fr; gap: 14px; align-items: start; height: 100%; }
  .two-col .panel { display: flex; flex-direction: column; max-height: 100%; }
  .two-col .panel .panel-body.pad0 { overflow: auto; }

  /* ---------- pills / badges ---------- */
  .pill {
    display: inline-block; font-size: 10px; padding: 1.5px 7px; border-radius: 2px;
    border: 1px solid transparent; font-weight: 700; letter-spacing: .02em; white-space: nowrap;
  }
  .pill-green { background: var(--green-bg); color: var(--green); border-color: var(--green-border); }
  .pill-amber { background: var(--amber-bg); color: var(--amber); border-color: var(--amber-border); }
  .pill-red { background: var(--red-bg); color: var(--red); border-color: var(--red-border); }
  .pill-blue { background: var(--accent-bg); color: var(--accent); border-color: var(--accent-border); }
  .pill-gray { background: var(--gray-bg); color: var(--text-dim); border-color: var(--gray-border); }

  .prov-tag {
    display: inline-flex; align-items: center; gap: 3px; font-size: 9.5px; padding: 1px 6px;
    border-radius: 2px; background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-border);
    letter-spacing: .01em; cursor: help; font-weight: 600;
  }

  .banner {
    display: flex; gap: 10px; align-items: flex-start; padding: 10px 13px; border-radius: 4px;
    font-size: 12px; margin-bottom: 12px; border: 1px solid;
  }
  .banner-defect { background: var(--red-bg); border-color: var(--red-border); color: var(--red); }
  .banner-warn { background: var(--amber-bg); border-color: var(--amber-border); color: var(--amber); }
  .banner-icon { font-weight: 800; flex: 0 0 auto; }
  .banner b { font-weight: 700; }

  .empty-state {
    display: flex; align-items: center; justify-content: center; height: 100%; min-height: 220px;
    color: var(--text-faint); font-size: 12.5px; text-align: center; padding: 20px;
  }

  .kv-row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 12px; }
  .kv-row .k { color: var(--text-dim); }
  .kv-row .v { font-variant-numeric: tabular-nums; font-weight: 600; }

  .detail-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .detail-header h1 { margin: 0 0 3px; font-size: 14.5px; }
  .detail-header .addr { color: var(--text-dim); font-size: 11.5px; }
  .detail-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }

  .stat-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; border-bottom: 1px solid var(--border); }
  .stat-cell { padding: 10px 14px; border-right: 1px solid var(--border); }
  .stat-cell:last-child { border-right: none; }
  .stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-faint); margin-bottom: 3px; }
  .stat-value { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat-value.warn { color: var(--red); }

  .lines-wrap { background: var(--panel-alt); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border-strong); padding: 10px 14px 12px 34px; }
  .lines-wrap .lines-title { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-faint); margin-bottom: 6px; }
  .lines-summary { display: flex; gap: 22px; margin-top: 8px; flex-wrap: wrap; font-size: 11.5px; }
  .lines-summary .item .k { color: var(--text-faint); font-size: 10px; text-transform: uppercase; letter-spacing: .03em; display: block; }
  .lines-summary .item .v { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 13px; }

  .chevron { display: inline-block; width: 12px; color: var(--text-faint); }

  .filter-row { padding: 8px 12px; border-bottom: 1px solid var(--border); }

  /* ---------- dispatch ---------- */
  .engineer-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
  .eng-card-head { display: flex; justify-content: space-between; align-items: baseline; }
  .eng-card-head .eng-name { font-weight: 700; font-size: 12.5px; }
  .eng-card-head .eng-skills { font-size: 10px; color: var(--text-faint); }
  .job-row { display: flex; justify-content: space-between; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
  .job-row:last-child { border-bottom: none; }
  .job-row .job-main { min-width: 0; }
  .job-row .job-addr { color: var(--text-dim); font-size: 11px; }
  .job-row .job-time { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; text-align: right; }
  .job-row.overlap { background: var(--red-bg); margin: 0 -12px; padding: 7px 12px; }

  code.route { display: block; font-family: Consolas, monospace; font-size: 11.5px; padding: 3px 0; color: var(--text); }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #d3d6db; border-radius: 6px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-track { background: var(--bg); }
</style>
</head>
<body>
  <div id="shell">
    <nav id="sidebar">
      <div class="brand">
        <div class="brand-name">THORNBURY SYSTEMS</div>
        <div class="brand-sub">Ops Console &middot; read-only</div>
      </div>
      <ul class="nav-list" id="navList"></ul>
      <div class="sidebar-footer">
        API: <strong>GET-only</strong><br>
        No writes are possible from this build.
      </div>
    </nav>
    <main id="main">
      <div class="topbar">
        <div>
          <div class="topbar-title" id="topbarTitle">&nbsp;</div>
          <div class="topbar-meta" id="topbarMeta">&nbsp;</div>
        </div>
        <div class="topbar-right" id="topbarRight"></div>
      </div>
      <div class="content" id="content"></div>
    </main>
  </div>

  <script src="data.js"></script>
  <script>
  (function () {
    'use strict';

    var VAT_PROV_TITLE = 'Unconfirmed rule — PRD D1: SUPPLY zero-rated for DOMESTIC / standard-rated for COMMERCIAL is an inference. Finance (Sandra) has not confirmed it.';
    var NOT_IN_API_TITLE = 'Not in the API yet — every route is GET-only. See Queue → API surface.';

    var SCREENS = [
      { id: 'accounts',     label: 'Accounts',     key: '1' },
      { id: 'dispatch',     label: 'Dispatch',     key: '2' },
      { id: 'appointments', label: 'Appointments', key: '3' },
      { id: 'queue',        label: 'Queue',        key: '4' }
    ];

    var state = {
      screen: 'accounts',
      customerId: null,
      expandedInvoice: null,
      filter: '',
      scenario: false
    };

    function provTag() {
      return '<span class="prov-tag" title="' + esc(VAT_PROV_TITLE) + '">&#9432; unconfirmed &middot; PRD D1</span>';
    }

    function accountTypePill(c) {
      return c.accountType === 'COMMERCIAL'
        ? '<span class="pill pill-blue">COMMERCIAL</span>'
        : '<span class="pill pill-gray">DOMESTIC</span>';
    }

    function paidPill(paid) {
      return paid ? '<span class="pill pill-green">PAID</span>' : '<span class="pill pill-amber">UNPAID</span>';
    }

    function jobStatePill(s) {
      if (s === 'SHIPPED') return '<span class="pill pill-green">SHIPPED</span>';
      if (s === 'PARTIAL') return '<span class="pill pill-amber">PARTIAL</span>';
      return '<span class="pill pill-gray">' + esc(s) + '</span>';
    }

    /* ---------------- shell ---------------- */
    function renderShell() {
      var nav = SCREENS.map(function (s) {
        var active = s.id === state.screen ? ' active' : '';
        return '<li class="nav-item' + active + '" onclick="App.go(\'' + s.id + '\')">' +
          '<span>' + s.label + '</span><span class="nav-key">' + s.key + '</span></li>';
      }).join('');
      el('#navList').innerHTML = nav;
      renderContent();
    }

    function setTopbar(title, meta, rightHtml) {
      el('#topbarTitle').textContent = title;
      el('#topbarMeta').textContent = meta || '';
      el('#topbarRight').innerHTML = rightHtml || '';
    }

    function renderContent() {
      var c = el('#content');
      if (state.screen === 'accounts') { c.innerHTML = accountsScreen(); return; }
      if (state.screen === 'dispatch') { c.innerHTML = dispatchScreen(); return; }
      if (state.screen === 'appointments') { c.innerHTML = appointmentsScreen(); return; }
      if (state.screen === 'queue') { c.innerHTML = queueScreen(); return; }
      c.innerHTML = '';
    }

    /* ==================================================================
       ACCOUNTS  (+ nested Statement / Invoice-detail)
       ================================================================== */
    function accountsScreen() {
      setTopbar(
        'Accounts',
        CUSTOMERS.length + ' accounts on file',
        '<button class="btn btn-primary" disabled title="' + esc(NOT_IN_API_TITLE) + '">+ New invoice</button>'
      );

      var filter = state.filter.trim().toLowerCase();
      var rows = CUSTOMERS.filter(function (c) {
        if (!filter) return true;
        return (c.id + ' ' + c.name + ' ' + c.address).toLowerCase().indexOf(filter) !== -1;
      });

      var listRows = rows.map(function (c) {
        var sel = c.id === state.customerId ? ' selected' : '';
        var outstanding = outstandingFor(c.id);
        return '<tr class="clickable' + sel + '" onclick="App.selectCustomer(\'' + c.id + '\')">' +
          '<td class="mono">' + esc(c.id) + '</td>' +
          '<td>' + esc(c.name) + '</td>' +
          '<td>' + accountTypePill(c) + '</td>' +
          '<td class="num' + (outstanding > 0 ? ' warn' : '') + '" style="' + (outstanding > 0 ? 'color:var(--red);font-weight:700;' : '') + '">' + esc(money.format(outstanding)) + '</td>' +
        '</tr>';
      }).join('') || '<tr><td colspan="4" class="dim" style="padding:16px 10px;">No accounts match &ldquo;' + esc(state.filter) + '&rdquo;.</td></tr>';

      var listPanel =
        '<div class="panel" style="height:100%;">' +
          '<div class="panel-head"><h2>Customers</h2><span class="dim" style="font-size:11px;">' + rows.length + ' shown</span></div>' +
          '<div class="filter-row"><input class="input" placeholder="Filter by id, name or address&hellip;" value="' + esc(state.filter) + '" oninput="App.filterAccounts(this.value)"></div>' +
          '<div class="panel-body pad0">' +
            '<table class="data">' +
              '<thead><tr><th>ID</th><th>Name</th><th>Type</th><th class="num">Outstanding</th></tr></thead>' +
              '<tbody>' + listRows + '</tbody>' +
            '</table>' +
          '</div>' +
        '</div>';

      var detailPanel = state.customerId ? customerDetail(customerFor(state.customerId)) :
        '<div class="panel" style="height:100%;"><div class="empty-state">Select an account on the left to view its statement and invoices.</div></div>';

      return '<div class="two-col">' + listPanel + detailPanel + '</div>';
    }

    function customerDetail(customer) {
      if (!customer) return '<div class="panel"><div class="empty-state">Account not found.</div></div>';
      var st = statementFor(customer);
      var t = st.totals;

      var badges = accountTypePill(customer) +
        (customer.vatRegistered ? ' <span class="pill pill-gray">VAT REG&#39;D</span>' : ' <span class="pill pill-gray">NOT VAT REG&#39;D</span>');

      var header =
        '<div class="detail-header">' +
          '<div>' +
            '<h1>' + esc(customer.name) + ' <span class="dim mono" style="font-size:11px;font-weight:400;">' + esc(customer.id) + '</span></h1>' +
            '<div class="addr">' + esc(customer.address) + '</div>' +
            '<div class="detail-badges">' + badges + '</div>' +
          '</div>' +
        '</div>';

      var stats =
        '<div class="stat-grid">' +
          '<div class="stat-cell"><div class="stat-label">Net</div><div class="stat-value">' + esc(money.format(t.net)) + '</div></div>' +
          '<div class="stat-cell"><div class="stat-label">VAT ' + provTag() + '</div><div class="stat-value">' + esc(money.format(t.vat)) + '</div></div>' +
          '<div class="stat-cell"><div class="stat-label">Invoiced</div><div class="stat-value">' + esc(money.format(t.invoiced)) + '</div></div>' +
          '<div class="stat-cell"><div class="stat-label">Paid</div><div class="stat-value">' + esc(money.format(t.paid)) + '</div></div>' +
          '<div class="stat-cell"><div class="stat-label">Outstanding</div><div class="stat-value' + (t.outstanding > 0 ? ' warn' : '') + '">' + esc(money.format(t.outstanding)) + '</div></div>' +
        '</div>';

      var invRows = st.invoices.length ? st.invoices.map(function (inv) {
        var expanded = state.expandedInvoice === inv.id;
        var row = '<tr class="clickable' + (expanded ? ' selected' : '') + '" onclick="App.toggleInvoice(\'' + inv.id + '\')">' +
          '<td><span class="chevron">' + (expanded ? '▾' : '▸') + '</span><span class="mono">' + esc(inv.id) + '</span></td>' +
          '<td>' + esc(inv.issued) + '</td>' +
          '<td><span class="pill pill-gray">' + esc(inv.source) + '</span></td>' +
          '<td>' + paidPill(inv.paid) + '</td>' +
          '<td class="num">' + esc(money.format(inv.net)) + '</td>' +
          '<td class="num">' + esc(money.format(inv.vat)) + '</td>' +
          '<td class="num" style="font-weight:700;">' + esc(money.format(inv.total)) + '</td>' +
        '</tr>';
        if (expanded) row += '<tr><td colspan="7" style="padding:0;border-bottom:1px solid var(--border);">' + invoiceLineDetail(inv, customer) + '</td></tr>';
        return row;
      }).join('') : '<tr><td colspan="7" class="dim" style="padding:14px 10px;">No invoices for this account.</td></tr>';

      var footRow = st.invoices.length ? (
        '<tr class="foot-row"><td colspan="4">Totals</td>' +
          '<td class="num">' + esc(money.format(t.net)) + '</td>' +
          '<td class="num">' + esc(money.format(t.vat)) + '</td>' +
          '<td class="num">' + esc(money.format(t.invoiced)) + '</td>' +
        '</tr>'
      ) : '';

      var statementPanel =
        '<div class="panel">' +
          '<div class="panel-head"><h2>Statement</h2><span class="dim" style="font-size:11px;">' + st.invoices.length + ' invoice' + (st.invoices.length === 1 ? '' : 's') + ' &middot; sorted by issue date</span></div>' +
          '<div class="panel-body pad0">' +
            '<table class="data">' +
              '<thead><tr><th>Invoice</th><th>Issued</th><th>Source</th><th>Status</th><th class="num">Net</th><th class="num">VAT</th><th class="num">Total</th></tr></thead>' +
              '<tbody>' + invRows + footRow + '</tbody>' +
            '</table>' +
          '</div>' +
        '</div>';

      return '<div style="height:100%;overflow:auto;">' +
        '<div class="panel">' + header + stats + '</div>' +
        statementPanel +
      '</div>';
    }

    function vatTreatmentPill(line, customer) {
      return isVatable(line, customer)
        ? '<span class="pill pill-blue">STANDARD 20%</span>'
        : '<span class="pill pill-gray">ZERO-RATED</span>';
    }

    function invoiceLineDetail(inv, customer) {
      var rows = inv.lines.map(function (l) {
        return '<tr>' +
          '<td>' + esc(l.description) + ' <span class="dim" style="font-size:10.5px;">(' + esc(l.kind) + ')</span></td>' +
          '<td class="num">' + esc(l.quantity.toLocaleString('en-GB')) + '</td>' +
          '<td class="num">' + esc(money.format(l.unitPence)) + '</td>' +
          '<td class="num" style="font-weight:600;">' + esc(money.format(lineTotal(l))) + '</td>' +
          '<td>' + vatTreatmentPill(l, customer) + '</td>' +
        '</tr>';
      }).join('');

      return '<div class="lines-wrap">' +
        '<div class="lines-title">Line items &mdash; ' + esc(inv.id) + '</div>' +
        '<table class="data">' +
          '<thead><tr><th>Description</th><th class="num">Qty</th><th class="num">Unit price</th><th class="num">Line total</th><th>VAT treatment ' + provTag() + '</th></tr></thead>' +
          '<tbody>' + rows + '</tbody>' +
        '</table>' +
        '<div class="lines-summary">' +
          '<div class="item"><span class="k">Zero-rated</span><span class="v">' + esc(money.format(inv.zeroRated)) + '</span></div>' +
          '<div class="item"><span class="k">Vatable (net)</span><span class="v">' + esc(money.format(inv.vatable)) + '</span></div>' +
          '<div class="item"><span class="k">VAT (20%)</span><span class="v">' + esc(money.format(inv.vat)) + '</span></div>' +
          '<div class="item"><span class="k">Net</span><span class="v">' + esc(money.format(inv.net)) + '</span></div>' +
          '<div class="item"><span class="k">Total</span><span class="v">' + esc(money.format(inv.total)) + '</span></div>' +
        '</div>' +
      '</div>';
    }

    /* ==================================================================
       DISPATCH
       ================================================================== */
    function dispatchScreen() {
      var orders = state.scenario ? scenarioVanAlreadyOut() : WORK_ORDERS;
      var plan = dispatchPlan(orders);
      var dupes = duplicateVisits(orders, plan.planned);
      var overlapList = overlaps(plan.planned);

      setTopbar(
        'Dispatch',
        plan.planned.length + ' planned · ' + plan.skipped.length + ' skipped · ' + overlapList.length + ' overlap' + (overlapList.length === 1 ? '' : 's'),
        '<label class="switch' + (state.scenario ? ' on' : '') + '" onclick="App.toggleScenario()">' +
          '<span class="switch-label">Van already out (scenario)</span><span class="switch-track"></span>' +
        '</label>' +
        '<button class="btn btn-primary" disabled title="' + esc(NOT_IN_API_TITLE) + '" style="margin-left:10px;">Commit dispatch</button>'
      );

      var html = '';

      if (dupes.length) {
        html += dupes.map(function (d) {
          return '<div class="banner banner-defect"><span class="banner-icon">&#9888;</span><div>' +
            '<b>Duplicate visit &mdash; unfixed defect (PRD 3.1).</b> ' +
            esc(d.existing) + ' is already dispatched to ' + esc(d.address) + '. Dispatch has now also planned ' + esc(d.planned) +
            ' to the same address' + (d.sameEngineer ? ', with the <b>same engineer</b> sent twice.' : '.') +
            ' The duplicate check only compares against orders planned in this call &mdash; it cannot see vans already out.' +
          '</div></div>';
        }).join('');
      }

      if (overlapList.length) {
        html += overlapList.map(function (o) {
          return '<div class="banner banner-warn"><span class="banner-icon">&#9888;</span><div>' +
            '<b>Schedule overlap.</b> Engineer ' + esc(o.engineerId) + ' (' + esc(engineerFor(o.engineerId).name) + ') is booked on ' +
            esc(o.a) + ' and ' + esc(o.b) + ' with no availability check in dispatch().' +
          '</div></div>';
        }).join('');
      }

      var cards = ENGINEERS.map(function (e) {
        var jobs = plan.planned.filter(function (a) { return a.engineerId === e.id; })
          .sort(function (a, b) { return a.startsAt.localeCompare(b.startsAt); });
        var overlapIds = {};
        overlapList.filter(function (o) { return o.engineerId === e.id; }).forEach(function (o) { overlapIds[o.a] = true; overlapIds[o.b] = true; });

        var jobsHtml = jobs.length ? jobs.map(function (j) {
          var slot = slotFor(orderFor(j.workOrderId));
          var cust = customerFor(j.customerId);
          var isOverlap = !!overlapIds[j.workOrderId];
          return '<div class="job-row' + (isOverlap ? ' overlap' : '') + '">' +
            '<div class="job-main">' +
              '<span class="mono">' + esc(j.workOrderId) + '</span> &middot; ' + esc(cust ? cust.name : j.customerId) +
              ' <span class="pill pill-gray" style="margin-left:2px;">' + esc(j.requires) + '</span>' +
              '<div class="job-addr">' + esc(j.address) + '</div>' +
            '</div>' +
            '<div class="job-time">' + esc(slot.from) + '&ndash;' + esc(slot.to) + (slot.rollsOver ? ' <span class="pill pill-amber">+1d</span>' : '') + '<div class="dim" style="font-weight:400;font-size:10.5px;">' + esc(slot.shortDate) + '</div></div>' +
          '</div>';
        }).join('') : '<div class="dim" style="padding:8px 0;">No jobs planned.</div>';

        return '<div class="panel">' +
          '<div class="panel-head"><div class="eng-card-head" style="width:100%;"><span class="eng-name">' + esc(e.name) + ' <span class="mono dim" style="font-weight:400;">' + esc(e.id) + '</span></span><span class="eng-skills">' + e.skills.join(' &middot; ') + '</span></div></div>' +
          '<div class="panel-body">' + jobsHtml + '</div>' +
        '</div>';
      }).join('');

      html += '<div class="engineer-grid">' + cards + '</div>';

      var skippedRows = plan.skipped.length ? plan.skipped.map(function (s) {
        return '<tr>' +
          '<td class="mono">' + esc(s.order.id) + '</td>' +
          '<td>' + esc((customerFor(s.order.customerId) || {}).name || s.order.customerId) + '</td>' +
          '<td>' + esc(s.order.address) + '</td>' +
          '<td>' + esc(s.order.requires) + '</td>' +
          '<td>' + esc(s.reason) + (s.clashWith ? ' (clash with <span class="mono">' + esc(s.clashWith) + '</span>)' : '') + '</td>' +
        '</tr>';
      }).join('') : '<tr><td colspan="5" class="dim" style="padding:12px 10px;">No orders skipped.</td></tr>';

      html += '<div class="panel">' +
        '<div class="panel-head"><h2>Skipped</h2></div>' +
        '<div class="panel-body pad0"><table class="data">' +
          '<thead><tr><th>Work order</th><th>Customer</th><th>Address</th><th>Requires</th><th>Reason</th></tr></thead>' +
          '<tbody>' + skippedRows + '</tbody>' +
        '</table></div>' +
      '</div>';

      return html;
    }

    /* ==================================================================
       APPOINTMENTS
       ================================================================== */
    function appointmentsScreen() {
      setTopbar('Appointments', WORK_ORDERS.length + ' work orders · customer-facing windows', '');

      var rows = WORK_ORDERS.map(function (w) {
        var slot = slotFor(w);
        var cust = customerFor(w.customerId);
        var storedUtcDate = w.requestedAt.slice(0, 10);
        var toEnd = new Date(new Date(w.requestedAt).getTime() + (w.durationMinutes + WINDOW_PADDING_MINUTES) * 60000);

        var windowHtml = esc(slot.from) + ' &rarr; ' + esc(slot.to);
        if (slot.rollsOver) {
          windowHtml += ' <span class="pill pill-amber" title="Window crosses UK midnight">+1 day &middot; ' + esc(fmtShort.format(toEnd)) + '</span>';
        }

        var dateHtml = esc(slot.longDate);
        if (slot.utcDayDiffers) {
          dateHtml += ' <span class="pill pill-gray" title="Stored requestedAt is UTC ' + esc(storedUtcDate) + ', shown here as the UK-local calendar day">stored UTC ' + esc(storedUtcDate) + '</span>';
        }

        return '<tr>' +
          '<td class="mono">' + esc(w.id) + '</td>' +
          '<td>' + esc(cust ? cust.name : w.customerId) + '</td>' +
          '<td>' + esc(w.address) + '</td>' +
          '<td><span class="pill pill-gray">' + esc(w.requires) + '</span></td>' +
          '<td>' + dateHtml + '</td>' +
          '<td class="num">' + windowHtml + '</td>' +
          '<td><span class="pill pill-blue">' + esc(w.status) + '</span></td>' +
        '</tr>';
      }).join('');

      return '<div class="panel">' +
        '<div class="panel-head"><h2>Customer appointment windows</h2><span class="dim" style="font-size:11px;">Times shown in Europe/London, via slotFor()</span></div>' +
        '<div class="panel-body pad0"><table class="data">' +
          '<thead><tr><th>Work order</th><th>Customer</th><th>Address</th><th>Skill</th><th>Date</th><th class="num">Window</th><th>Status</th></tr></thead>' +
          '<tbody>' + rows + '</tbody>' +
        '</table></div>' +
      '</div>';
    }

    /* ==================================================================
       QUEUE
       ================================================================== */
    function queueScreen() {
      setTopbar('Queue', JOBS.length + ' support tickets · ' + OPEN_DECISIONS.length + ' open decisions', '');

      var jobRows = JOBS.map(function (j) {
        return '<tr>' +
          '<td class="mono">' + esc(j.id) + '</td>' +
          '<td>' + esc(j.title) + '<div class="dim" style="font-size:11px;margin-top:2px;">' + esc(j.caveat) + '</div></td>' +
          '<td>' + esc(j.by) + '</td>' +
          '<td>' + esc(j.raised) + '</td>' +
          '<td class="num">' + esc(j.age) + 'd</td>' +
          '<td>' + jobStatePill(j.state) + '</td>' +
          '<td><button class="btn" disabled title="' + esc(NOT_IN_API_TITLE) + '">Close</button></td>' +
        '</tr>';
      }).join('');

      var decisionRows = OPEN_DECISIONS.map(function (d) {
        var pillClass = d.state.indexOf('Unsourced') === 0 ? 'pill-amber' : 'pill-gray';
        return '<tr>' +
          '<td class="mono">' + esc(d.id) + '</td>' +
          '<td>' + esc(d.q) + '</td>' +
          '<td>' + esc(d.who) + '</td>' +
          '<td><span class="pill ' + pillClass + '">' + esc(d.state) + '</span></td>' +
        '</tr>';
      }).join('');

      var routes = API_ROUTES.map(function (r) { return '<code class="route">' + esc(r) + '</code>'; }).join('');

      return '' +
        '<div class="panel">' +
          '<div class="panel-head"><h2>Support queue</h2></div>' +
          '<div class="panel-body pad0"><table class="data">' +
            '<thead><tr><th>ID</th><th>Ticket</th><th>Raised by</th><th>Raised</th><th class="num">Age</th><th>Status</th><th></th></tr></thead>' +
            '<tbody>' + jobRows + '</tbody>' +
          '</table></div>' +
        '</div>' +
        '<div class="panel">' +
          '<div class="panel-head"><h2>Open decisions &mdash; PRD 4</h2><span class="dim" style="font-size:11px;">Business rules on main that nobody at Thornbury has confirmed</span></div>' +
          '<div class="panel-body pad0"><table class="data">' +
            '<thead><tr><th>ID</th><th>Question</th><th>Owner</th><th>Status</th></tr></thead>' +
            '<tbody>' + decisionRows + '</tbody>' +
          '</table></div>' +
        '</div>' +
        '<div class="panel">' +
          '<div class="panel-head"><h2>API surface</h2><span class="dim" style="font-size:11px;">Every route is read-only &mdash; no POST / PATCH / DELETE exists</span></div>' +
          '<div class="panel-body">' + routes + '</div>' +
        '</div>';
    }

    /* ---------------- actions ---------------- */
    var App = {
      go: function (screenId) {
        state.screen = screenId;
        renderShell();
      },
      selectCustomer: function (id) {
        state.customerId = id;
        state.expandedInvoice = null;
        renderContent();
      },
      toggleInvoice: function (id) {
        state.expandedInvoice = (state.expandedInvoice === id) ? null : id;
        renderContent();
      },
      filterAccounts: function (v) {
        state.filter = v;
        renderContent();
        var input = document.querySelector('.filter-row input');
        if (input) { input.focus(); input.selectionStart = input.selectionEnd = input.value.length; }
      },
      toggleScenario: function () {
        state.scenario = !state.scenario;
        renderContent();
      }
    };
    window.App = App;

    document.addEventListener('keydown', function (ev) {
      var tag = (document.activeElement && document.activeElement.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      var match = SCREENS.find(function (s) { return s.key === ev.key; });
      if (match) App.go(match.id);
    });

    renderShell();
  })();
  </script>
</body>
</html>
