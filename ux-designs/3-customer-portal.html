<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thornbury Water — Your Account</title>
<style>
  :root{
    --teal-700:#0b5c56;
    --teal-600:#0f766e;
    --teal-500:#14b8a6;
    --teal-100:#e3f6f2;
    --cream:#f6f7f2;
    --card:#ffffff;
    --ink:#1e2a2a;
    --muted:#5c6b6b;
    --line:#e4ece9;
    --amber:#b45309;
    --amber-bg:#fdf1de;
    --green:#127a4f;
    --green-bg:#e4f6ec;
    --radius-lg:20px;
    --radius-md:14px;
    --shadow:0 4px 16px rgba(15,60,55,0.08), 0 1px 3px rgba(15,60,55,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding-bottom:92px;
  }
  h1,h2,h3{font-family:inherit;}
  .app{max-width:640px;margin:0 auto;padding:0 18px;}

  /* ---- top bar ---- */
  .topbar{padding:18px 0 8px;}
  .brandrow{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .brandtext strong{display:block;font-size:16px;color:var(--teal-700);}
  .brandtext span{display:block;font-size:12px;color:var(--muted);}
  .switcher{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;-webkit-overflow-scrolling:touch;}
  .switchbtn{flex:0 0 auto;white-space:nowrap;background:#fff;border:1.5px solid var(--line);border-radius:16px;
    padding:8px 14px;display:flex;flex-direction:column;align-items:flex-start;cursor:pointer;font-family:inherit;text-align:left;}
  .switchbtn .sname{font-size:13px;font-weight:700;color:var(--ink);}
  .switchbtn .stype{font-size:11px;color:var(--muted);margin-top:1px;}
  .switchbtn.active{border-color:var(--teal-500);background:var(--teal-100);}
  .switchbtn.active .sname{color:var(--teal-700);}

  /* ---- screens ---- */
  .screen{display:none;}
  .screen.active{display:block;}
  .hello{font-size:22px;margin:6px 0 2px;}
  .addr{color:var(--muted);font-size:14px;margin:0 0 10px;}

  .hero{border-radius:var(--radius-lg);padding:26px 22px;margin:16px 0;box-shadow:var(--shadow);}
  .hero.due{background:linear-gradient(155deg,#ffffff,var(--teal-100));border:1px solid var(--teal-100);}
  .hero.paid{background:var(--green-bg);border:1px solid #cdeedd;}
  .herolabel{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;}
  .heroamt{font-size:42px;font-weight:800;color:var(--teal-700);line-height:1.1;}
  .hero p{margin:8px 0 14px;color:var(--muted);font-size:15px;}

  .card{background:var(--card);border-radius:var(--radius-lg);padding:18px 20px;margin:14px 0;box-shadow:var(--shadow);}
  .card h2{margin:0 0 10px;font-size:16px;color:var(--teal-700);}
  .muted{color:var(--muted);}

  .billlist{display:flex;flex-direction:column;gap:8px;}
  .billrow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--cream);
    border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-family:inherit;font-size:14px;cursor:pointer;
    width:100%;text-align:left;color:var(--ink);}
  .billdate{color:var(--muted);flex:1;}
  .billamt{font-weight:700;}

  .badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;margin-left:8px;white-space:nowrap;}
  .badge-paid{background:var(--green-bg);color:var(--green);}
  .badge-due{background:var(--amber-bg);color:var(--amber);}

  .btn{font-family:inherit;font-size:13px;font-weight:700;padding:12px 16px;border-radius:12px;border:none;
    cursor:not-allowed;display:inline-flex;flex-direction:column;align-items:center;gap:3px;background:#eef2f1;color:#8a9997;}
  .btn .notyet{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:#a3b0ae;}
  .actionrow{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}

  /* ---- bill screen ---- */
  .chiprow{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;}
  .chip{flex:0 0 auto;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;
    font-size:13px;font-family:inherit;cursor:pointer;white-space:nowrap;color:var(--ink);}
  .chip.active{border-color:var(--teal-500);background:var(--teal-100);color:var(--teal-700);font-weight:700;}
  .billhead{display:flex;align-items:center;justify-content:space-between;font-weight:700;margin-bottom:12px;font-size:15px;}
  .lineitems{display:flex;flex-direction:column;gap:10px;}
  .lineitem{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
  .lineitem:last-child{border-bottom:none;}
  .linemain{display:flex;flex-direction:column;gap:2px;}
  .linedesc{font-weight:600;font-size:14px;}
  .lineqty{font-size:12px;color:var(--muted);}
  .lineside{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
  .lineamt{font-weight:700;font-size:14px;}
  .vattag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;}
  .vattag-on{background:var(--teal-100);color:var(--teal-700);}
  .vattag-off{background:#f0f3f2;color:var(--muted);}
  .billtotals{margin-top:14px;padding-top:12px;border-top:2px solid var(--line);}
  .trow{display:flex;justify-content:space-between;padding:4px 0;font-size:14px;color:var(--muted);}
  .trow.ttotal{font-size:17px;font-weight:800;color:var(--teal-700);border-top:1px solid var(--line);margin-top:6px;padding-top:10px;}
  .explain p{margin:0;color:var(--ink);font-size:14px;}

  /* ---- statement screen ---- */
  .notice{background:var(--teal-100);color:var(--teal-700);border-radius:12px;padding:12px 14px;font-size:13.5px;margin:10px 0 16px;}
  .statement .strow{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr 1fr;gap:8px;padding:10px 0;
    border-bottom:1px solid var(--line);align-items:center;font-size:13.5px;}
  .stheader{font-weight:700;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;
    border-bottom:2px solid var(--line);}
  .sttotals{margin-top:8px;padding-top:8px;border-top:2px solid var(--line);}
  @media (max-width:520px){
    .statement .strow{grid-template-columns:1fr 1fr;row-gap:4px;}
    .statement .strow > span::before{content:attr(data-label) ": ";font-weight:700;color:var(--muted);}
    .stheader{display:none;}
  }

  /* ---- appointments screen ---- */
  .appcard{border-left:5px solid var(--teal-500);}
  .appcard.rollover{border-left:5px solid var(--amber);}
  .apphead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .aptype{font-weight:800;font-size:15px;color:var(--teal-700);}
  .apstatus{font-size:12px;font-weight:700;color:var(--muted);background:var(--cream);padding:3px 10px;border-radius:999px;}
  .apwhen{margin:4px 0;font-size:14.5px;}
  .apaddr{margin:8px 0 0;color:var(--muted);font-size:13.5px;}
  .apwarn{margin:0 0 6px;font-size:12.5px;font-weight:700;color:var(--amber);background:var(--amber-bg);
    display:inline-block;padding:3px 10px;border-radius:999px;}
  .apsummary{margin:8px 0 0;font-size:13.5px;color:var(--ink);background:var(--amber-bg);padding:8px 10px;border-radius:10px;}

  /* ---- bottom nav ---- */
  .bottomnav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:20;box-shadow:0 -4px 14px rgba(15,60,55,0.06);}
  .bottomnav-inner{max-width:640px;margin:0 auto;display:flex;justify-content:space-around;}
  .bottomnav button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;
    font-size:11.5px;font-family:inherit;color:var(--muted);padding:6px 2px;cursor:pointer;border-radius:10px;}
  .bottomnav button.active{color:var(--teal-600);font-weight:700;}
  .navicon{font-size:20px;line-height:1;}

  /* ---- reviewer panel (staff-only, kept visually quiet) ---- */
  .reviewer{margin:30px 0 14px;font-size:12px;color:#7a8886;}
  .reviewer details{background:#eef2f1;border-radius:10px;padding:10px 14px;}
  .reviewer summary{cursor:pointer;font-weight:700;color:#5c6b6a;}
  .reviewer h3{font-size:11px;text-transform:uppercase;letter-spacing:.04em;margin:12px 0 4px;color:#5c6b6a;}
  .reviewer .revlist{margin:0;padding-left:16px;}
  .reviewer .revlist li{margin-bottom:8px;}
  .reviewer .revstate{font-weight:700;margin-left:4px;}
  .reviewer .revcaveat{color:#8a9694;}
  .reviewer .revflag{background:#fdf1de;color:#8a5a12;padding:6px 8px;border-radius:8px;font-weight:700;margin-top:10px;}
  .reviewer .revroutes{margin-top:10px;color:#8a9694;word-break:break-word;}

  @media print{
    .topbar,.bottomnav,.reviewer,.actionrow{display:none!important;}
    body{padding-bottom:0;background:#fff;}
    .card{box-shadow:none;border:1px solid #ccc;}
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brandrow">
      <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2C12 2 5 11 5 15.5C5 19.09 8.13 22 12 22C15.87 22 19 19.09 19 15.5C19 11 12 2 12 2Z" fill="#14b8a6"/>
      </svg>
      <div class="brandtext"><strong>Thornbury Water</strong><span>Your account</span></div>
    </div>
    <div class="switcher" id="switcher"></div>
  </header>

  <main id="screen-home" class="screen"></main>
  <main id="screen-bill" class="screen"></main>
  <main id="screen-statement" class="screen"></main>
  <main id="screen-appts" class="screen"></main>

  <section class="reviewer" id="reviewer"></section>
</div>

<nav class="bottomnav" id="bottomnav">
  <div class="bottomnav-inner">
    <button data-screen="home"><span class="navicon">🏠</span>Home</button>
    <button data-screen="bill"><span class="navicon">🧾</span>Bills</button>
    <button data-screen="statement"><span class="navicon">📊</span>Statement</button>
    <button data-screen="appts"><span class="navicon">📅</span>Visits</button>
  </div>
</nav>

<script src="data.js"></script>
<script>
(function(){
  "use strict";

  var STATE = { customerId: CUSTOMERS[0].id, screen: 'home', invoiceId: null };

  var REQUIRES_LABEL = { METER: 'Water meter check', LEAK: 'Leak inspection', BACKFLOW: 'Backflow safety test' };
  var ACCOUNT_LABEL = { DOMESTIC: 'Home account', COMMERCIAL: 'Business account' };
  var STATUS_LABEL = { QUEUED: 'Booked', DISPATCHED: 'Engineer assigned', COMPLETED: 'Completed' };

  var fmtPlainDate = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', day: 'numeric', month: 'long', year: 'numeric' });

  function formatIssued(isoDate) {
    return fmtPlainDate.format(new Date(isoDate));
  }

  function statusBadge(paid) {
    return '<span class="badge ' + (paid ? 'badge-paid' : 'badge-due') + '">' + (paid ? 'Paid' : 'Not yet paid') + '</span>';
  }

  function actionButton(label) {
    return '<button class="btn" disabled title="Not available in this prototype — the API is read-only.">' +
      esc(label) + '<span class="notyet">Not in the API yet</span></button>';
  }

  /* For a visit whose window crosses midnight, work out the calendar day
     each end of the window actually falls on, so both days can be named
     explicitly (PRD JOB D — a customer must never be able to misread this). */
  function windowDays(order) {
    var start = new Date(order.requestedAt);
    var fromDate = new Date(start.getTime() - WINDOW_PADDING_MINUTES * 60000);
    var toDate = new Date(start.getTime() + (order.durationMinutes + WINDOW_PADDING_MINUTES) * 60000);
    return { fromDay: fmtLong.format(fromDate), toDay: fmtLong.format(toDate) };
  }

  function appointmentBody(order, slot) {
    if (!slot.rollsOver) {
      return '<p class="apwhen"><strong>' + esc(slot.longDate) + '</strong><br>Between ' + slot.from + ' and ' + slot.to + '</p>';
    }
    var days = windowDays(order);
    return '<p class="apwarn">Crosses midnight — check both days</p>' +
      '<p class="apwhen">Starts <strong>' + esc(days.fromDay) + '</strong> at ' + slot.from + '</p>' +
      '<p class="apwhen">Finishes <strong>' + esc(days.toDay) + '</strong> at ' + slot.to + '</p>' +
      '<p class="apsummary">In short: this visit starts late on ' + esc(days.fromDay) + ' at ' + slot.from +
      ' and runs into the early hours of ' + esc(days.toDay) + ', finishing at ' + slot.to + '.</p>';
  }

  function appointmentCard(order) {
    var slot = slotFor(order);
    var kind = REQUIRES_LABEL[order.requires] || order.requires;
    return '<section class="card appcard' + (slot.rollsOver ? ' rollover' : '') + '">' +
      '<div class="apphead"><span class="aptype">' + esc(kind) + '</span>' +
      '<span class="apstatus">' + esc(STATUS_LABEL[order.status] || order.status) + '</span></div>' +
      appointmentBody(order, slot) +
      '<p class="apaddr">' + esc(order.address) + '</p>' +
      '<div class="actionrow">' + actionButton('Reschedule') + '</div>' +
      '</section>';
  }

  function appointmentTeaser(order) {
    var slot = slotFor(order);
    var kind = REQUIRES_LABEL[order.requires] || order.requires;
    return appointmentBody(order, slot) + '<p class="apaddr">' + esc(kind) + ' · ' + esc(order.address) + '</p>';
  }

  function renderSwitcher() {
    el('#switcher').innerHTML = CUSTOMERS.map(function (c) {
      var active = c.id === STATE.customerId ? ' active' : '';
      return '<button class="switchbtn' + active + '" data-cust="' + c.id + '">' +
        '<span class="sname">' + esc(c.name) + '</span>' +
        '<span class="stype">' + esc(ACCOUNT_LABEL[c.accountType] || c.accountType) + '</span>' +
        '</button>';
    }).join('');
  }

  function renderHome() {
    var customer = customerFor(STATE.customerId);
    var outstanding = outstandingFor(customer.id);
    var orders = WORK_ORDERS.filter(function (w) { return w.customerId === customer.id; })
      .slice().sort(function (a, b) { return a.requestedAt.localeCompare(b.requestedAt); });
    var next = orders[0];
    var bills = invoicesFor(customer.id).slice().sort(function (a, b) { return b.issued.localeCompare(a.issued); });

    var heroHtml = outstanding === 0
      ? '<div class="hero paid"><div class="herolabel">Your balance</div><div class="heroamt">' + money.format(0) +
        '</div><p>You’re all paid up. Nothing due right now.</p></div>'
      : '<div class="hero due"><div class="herolabel">You owe</div><div class="heroamt">' + money.format(outstanding) +
        '</div><p>Total across your unpaid bills.</p><div class="actionrow">' + actionButton('Pay now') + '</div></div>';

    var nextHtml = next
      ? appointmentTeaser(next)
      : '<p class="muted">No visits currently scheduled.</p>';

    var billsHtml = bills.map(function (inv) {
      var t = totalFor(inv, customer);
      return '<button class="billrow" data-invoice="' + inv.id + '">' +
        '<span class="billdate">' + esc(formatIssued(inv.issued)) + '</span>' +
        '<span class="billamt">' + money.format(t.total) + '</span>' +
        statusBadge(inv.paid) +
        '</button>';
    }).join('') || '<p class="muted">No bills yet.</p>';

    el('#screen-home').innerHTML =
      '<h1 class="hello">Hello, ' + esc(customer.name) + '</h1>' +
      '<p class="addr">' + esc(customer.address) + '</p>' +
      heroHtml +
      '<section class="card"><h2>Your next visit</h2>' + nextHtml + '</section>' +
      '<section class="card"><h2>Recent bills</h2><div class="billlist">' + billsHtml + '</div></section>';

    els('#screen-home [data-invoice]').forEach(function (btn) {
      btn.addEventListener('click', function () { STATE.invoiceId = btn.getAttribute('data-invoice'); setScreen('bill'); });
    });
  }

  function renderBill() {
    var customer = customerFor(STATE.customerId);
    var bills = invoicesFor(customer.id).slice().sort(function (a, b) { return b.issued.localeCompare(a.issued); });
    if (!STATE.invoiceId || !bills.some(function (b) { return b.id === STATE.invoiceId; })) {
      STATE.invoiceId = bills.length ? bills[0].id : null;
    }
    var container = el('#screen-bill');
    if (!STATE.invoiceId) {
      container.innerHTML = '<h1>Your bills</h1><p class="muted">No bills yet on this account.</p>';
      return;
    }
    var invoice = bills.filter(function (b) { return b.id === STATE.invoiceId; })[0];
    var t = totalFor(invoice, customer);

    var chips = bills.map(function (b) {
      var active = b.id === invoice.id ? ' active' : '';
      return '<button class="chip' + active + '" data-invoice="' + b.id + '">' + esc(formatIssued(b.issued)) + '</button>';
    }).join('');

    var lines = invoice.lines.map(function (l) {
      var vatable = isVatable(l, customer);
      return '<div class="lineitem">' +
        '<div class="linemain"><span class="linedesc">' + esc(l.description) + '</span>' +
        '<span class="lineqty">' + l.quantity + ' × ' + money.format(l.unitPence) + '</span></div>' +
        '<div class="lineside"><span class="lineamt">' + money.format(lineTotal(l)) + '</span>' +
        '<span class="vattag ' + (vatable ? 'vattag-on' : 'vattag-off') + '">' +
        (vatable ? '20% VAT added' : 'No VAT') + '</span></div>' +
        '</div>';
    }).join('');

    var explain = customer.accountType === 'DOMESTIC'
      ? '<p>Water supply charges on a home account do not carry VAT. If an engineer visit or call-out was needed, ' +
        'that part of the bill is still charged the standard 20% VAT — that’s why some lines above are marked and others aren’t.</p>'
      : '<p>As a business account, VAT at 20% is added to your water supply and to any engineer visit or service work on this bill.</p>';

    container.innerHTML =
      '<h1>Your bill</h1>' +
      '<div class="chiprow">' + chips + '</div>' +
      '<section class="card billcard">' +
      '<div class="billhead"><span>Bill dated ' + esc(formatIssued(invoice.issued)) + '</span>' + statusBadge(invoice.paid) + '</div>' +
      '<div class="lineitems">' + lines + '</div>' +
      '<div class="billtotals">' +
      '<div class="trow"><span>Subtotal</span><span>' + money.format(t.net) + '</span></div>' +
      '<div class="trow"><span>VAT</span><span>' + money.format(t.vat) + '</span></div>' +
      '<div class="trow ttotal"><span>Total</span><span>' + money.format(t.total) + '</span></div>' +
      '</div></section>' +
      '<section class="card explain"><h2>About the VAT on this bill</h2>' + explain + '</section>' +
      '<div class="actionrow">' + actionButton('Pay now') + actionButton('Download PDF') + '</div>';

    els('#screen-bill [data-invoice]').forEach(function (btn) {
      btn.addEventListener('click', function () { STATE.invoiceId = btn.getAttribute('data-invoice'); renderBill(); });
    });
  }

  function renderStatement() {
    var customer = customerFor(STATE.customerId);
    var st = statementFor(customer);
    var rows = st.invoices.map(function (r) {
      return '<div class="strow">' +
        '<span data-label="Date">' + esc(formatIssued(r.issued)) + '</span>' +
        '<span data-label="Net">' + money.format(r.net) + '</span>' +
        '<span data-label="VAT">' + money.format(r.vat) + '</span>' +
        '<span data-label="Total">' + money.format(r.total) + '</span>' +
        '<span data-label="Status">' + statusBadge(r.paid) + '</span>' +
        '</div>';
    }).join('') || '<p class="muted">No bills yet on this account.</p>';

    el('#screen-statement').innerHTML =
      '<h1>Your statement</h1>' +
      '<p class="addr">' + esc(customer.name) + ' · ' + esc(customer.address) + '</p>' +
      '<div class="notice">This statement lists every bill on your account since it began. Filtering by date range, ' +
      'and showing opening and closing balances, aren’t available yet — it’s an all-time view for now.</div>' +
      '<section class="card statement">' +
      '<div class="stheader strow"><span>Date</span><span>Net</span><span>VAT</span><span>Total</span><span>Status</span></div>' +
      rows +
      '<div class="sttotals">' +
      '<div class="trow"><span>Total net</span><span>' + money.format(st.totals.net) + '</span></div>' +
      '<div class="trow"><span>Total VAT</span><span>' + money.format(st.totals.vat) + '</span></div>' +
      '<div class="trow"><span>Total invoiced</span><span>' + money.format(st.totals.invoiced) + '</span></div>' +
      '<div class="trow"><span>Paid so far</span><span>' + money.format(st.totals.paid) + '</span></div>' +
      '<div class="trow ttotal"><span>Outstanding</span><span>' + money.format(st.totals.outstanding) + '</span></div>' +
      '</div></section>';
  }

  function renderAppointments() {
    var customer = customerFor(STATE.customerId);
    var orders = WORK_ORDERS.filter(function (w) { return w.customerId === customer.id; })
      .slice().sort(function (a, b) { return a.requestedAt.localeCompare(b.requestedAt); });
    var cards = orders.map(appointmentCard).join('') || '<p class="muted">No visits currently scheduled.</p>';
    el('#screen-appts').innerHTML = '<h1>Your visits</h1>' + cards;
  }

  function renderReviewer() {
    var jobs = JOBS.map(function (j) {
      return '<li><strong>' + esc(j.id) + '</strong> ' + esc(j.title) + ' <span class="revstate">' + esc(j.state) + '</span>' +
        '<br><span class="revcaveat">' + esc(j.caveat) + '</span></li>';
    }).join('');
    var decisions = OPEN_DECISIONS.map(function (d) {
      return '<li><strong>' + esc(d.id) + '</strong> ' + esc(d.q) + ' <span class="revstate">' + esc(d.state) + '</span> ' +
        '<span class="revcaveat">(' + esc(d.who) + ')</span></li>';
    }).join('');
    el('#reviewer').innerHTML =
      '<details><summary>Reviewer notes — not shown to customers</summary>' +
      '<p class="revflag">Unconfirmed rule — PRD D1: the VAT split shown to customers is a Finance-unconfirmed inference.</p>' +
      '<h3>Support queue</h3><ul class="revlist">' + jobs + '</ul>' +
      '<h3>Open decisions</h3><ul class="revlist">' + decisions + '</ul>' +
      '<p class="revroutes">API routes available: ' + esc(API_ROUTES.join(', ')) + '</p>' +
      '</details>';
  }

  var SCREEN_SELECTOR = { home: '#screen-home', bill: '#screen-bill', statement: '#screen-statement', appts: '#screen-appts' };

  function render() {
    renderSwitcher();
    els('.screen').forEach(function (s) { s.classList.remove('active'); });
    el(SCREEN_SELECTOR[STATE.screen]).classList.add('active');
    if (STATE.screen === 'home') renderHome();
    else if (STATE.screen === 'bill') renderBill();
    else if (STATE.screen === 'statement') renderStatement();
    else if (STATE.screen === 'appts') renderAppointments();
    els('#bottomnav button').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-screen') === STATE.screen);
    });
    renderReviewer();
  }

  function setScreen(name) { STATE.screen = name; render(); }

  el('#switcher').addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('[data-cust]') : null;
    if (!btn) return;
    STATE.customerId = btn.getAttribute('data-cust');
    STATE.invoiceId = null;
    render();
  });

  el('#bottomnav').addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('[data-screen]') : null;
    if (!btn) return;
    setScreen(btn.getAttribute('data-screen'));
  });

  render();
})();
</script>
</body>
</html>
